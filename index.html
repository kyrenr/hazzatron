<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>GridLock: The Great British Upgrade</title>
<script>
  /* Surface a startup failure instead of a silent blank page (e.g. a blocked
     CDN, a Babel compile error, or a sandboxed network). */
  window.addEventListener("error", function (e) {
    var r = document.getElementById("root");
    if (r && !r.hasChildNodes()) {
      r.innerHTML =
        '<div style="font-family:ui-monospace,Menlo,monospace;color:#f87171;background:#0f172a;' +
        'padding:24px;max-width:700px;margin:0 auto;font-size:13px;line-height:1.6">' +
        "<b style='color:#fbbf24'>GridLock failed to start.</b><br><br>" +
        ((e && (e.message || e.error)) || "Unknown error") +
        "<br><br>This usually means one of the page scripts could not load or run " +
        "(a blocked, slow or offline network). Check your connection and reload.</div>";
    }
  });
</script>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background: #0f172a; overscroll-behavior: none; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  /* dynamic viewport height so mobile browser chrome doesn't crop the app */
  .h-app { height: 100vh; height: 100dvh; }
  .map-svg { touch-action: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #1e293b; }
  ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

  @keyframes linePulse {
    0%, 100% { stroke: #ef4444; stroke-opacity: 1; }
    50%      { stroke: #f97316; stroke-opacity: 0.45; }
  }
  .pulse-danger { animation: linePulse 0.85s ease-in-out infinite; }

  @keyframes flowDash { to { stroke-dashoffset: -24; } }
  .flow-anim { animation: flowDash 0.9s linear infinite; }

  @keyframes nodeGlow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(74,222,128,0.8)); }
    50%      { filter: drop-shadow(0 0 9px rgba(74,222,128,0.9)); }
  }
  .node-glow { animation: nodeGlow 2.4s ease-in-out infinite; }

  @keyframes dropRing {
    0%, 100% { stroke-opacity: 0.9; r: 26; }
    50%      { stroke-opacity: 0.4; }
  }
  .drop-ring { animation: dropRing 0.8s ease-in-out infinite; }

  @keyframes blinkBadge { 0%,100% {opacity:1;} 50% {opacity:0.35;} }
  .blink { animation: blinkBadge 1s steps(1) infinite; }

  @keyframes slideUp { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .slide-up { animation: slideUp 0.25s ease-out; }

  @keyframes toastIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .toast-in { animation: toastIn 0.2s ease-out; }

  @keyframes shakeFrames {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-7px, 3px); } 40% { transform: translate(6px, -4px); }
    60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 3px); }
  }
  .shake { animation: shakeFrames 0.45s ease-in-out; }

  .font-term { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .chip-grab { cursor: grab; touch-action: none; user-select: none; }
  .chip-grab:active { cursor: grabbing; }
  /* robust touch scrolling for the side/build panels on mobile */
  .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
