/* ------------------------------ drag ghost ------------------------------ */
function DragGhost({ ghostRef, dragUI }) {
  if (!dragUI) return null;
  const cat = dragUI.item.cat;
  const def = paletteDef(dragUI.item);
  const t = dragUI.target;
  let targetLine = cat === "link" ? "drop on a transmission line…" : "drop on a region…";
  if (t) {
    if (t.type === "node") {
      const nd = NODE_DEFS[t.id];
      if (cat === "draw") {
        targetLine = `→ anchor at ${nd.short}, then click a destination`;
      } else {
        const mult = def.kind === "battery" ? 1 : (nd.yields[def.kind] || 1);
        targetLine = `→ ${nd.short}: ${r1(def.gw * mult)} GW`;
      }
    } else {
      targetLine = `→ ${LINK_DEFS[t.id].name}: +${def.addGW} GW`;
    }
  }
  return (
    <div ref={ghostRef} className="fixed z-50 pointer-events-none px-2.5 py-1.5 rounded-lg bg-slate-900/95 border border-cyan-400 shadow-2xl" style={{ left: -200, top: -200 }}>
      <div className="text-[12px] font-bold text-slate-100">{def.icon} {def.name}</div>
      <div className={`font-term text-[10px] ${t ? "text-cyan-300" : "text-slate-500"}`}>{targetLine}</div>
    </div>
  );
}

/* ------------------------------ root app -------------------------------- */
function App() {
  const [state, setState] = useState(initialState);
  const [selected, setSelected] = useState(null);
  const [tab, setTab] = useState("national");
  const [muted, setMuted] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [shaking, setShaking] = useState(false);
  const [dragUI, setDragUI] = useState(null);
  const [drawMode, setDrawMode] = useState(null);
  const [mobilePane, setMobilePane] = useState("map");   // map | build | national (small screens only)

  const stateRef = useRef(state);
  useEffect(() => { stateRef.current = state; }, [state]);
  const mutedRef = useRef(muted);
  useEffect(() => { mutedRef.current = muted; }, [muted]);
  const svgRef = useRef(null);
  const ghostRef = useRef(null);
  const dragRef = useRef(null);
  const rubberRef = useRef(null);

  /* rubber-band line follows the pointer while drawing a corridor */
  useEffect(() => {
    if (!drawMode) return;
    const move = e => {
      const p = svgPoint(e.clientX, e.clientY);
      if (p && rubberRef.current) {
        rubberRef.current.setAttribute("x2", p.x);
        rubberRef.current.setAttribute("y2", p.y);
      }
    };
    const key = e => { if (e.key === "Escape") setDrawMode(null); };
    window.addEventListener("pointermove", move);
    window.addEventListener("keydown", key);
    return () => { window.removeEventListener("pointermove", move); window.removeEventListener("keydown", key); };
  }, [drawMode ? drawMode.from : null]);

  const flows = useMemo(() => computeFlows(state, 0.9, 0.9), [state]);

  function addToast(text, tone) {
    const id = uid();
    setToasts(ts => [...ts.slice(-3), { id, text, tone }]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 3500);
  }
  function shake() {
    setShaking(true);
    setTimeout(() => setShaking(false), 500);
  }
  const play = kind => sfx(kind, mutedRef.current);

  /* ---- drag & drop machinery ---- */
  function svgPoint(clientX, clientY) {
    const svg = svgRef.current;
    if (!svg) return null;
    try {
      const pt = svg.createSVGPoint();
      pt.x = clientX; pt.y = clientY;
      const m = svg.getScreenCTM();
      if (!m) return null;
      return pt.matrixTransform(m.inverse());
    } catch (e) { return null; }
  }
  function distToSeg(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy), 0, 1);
    const qx = a.x + t * dx, qy = a.y + t * dy;
    return (p.x - qx) * (p.x - qx) + (p.y - qy) * (p.y - qy);
  }
  function hitTest(item, p) {
    if (!p) return null;
    if (item.cat === "asset" || item.cat === "draw") {
      let best = null, bd = 2600;
      for (const id of ["A", "B", "C", "D", "E"]) {
        if (item.id === "offshore" && !NODE_DEFS[id].offshoreOk) continue;
        if (item.id === "tidal" && !NODE_DEFS[id].tidalOk) continue;
        const d = NODE_DEFS[id];
        const dist = (p.x - d.x) * (p.x - d.x) + (p.y - d.y) * (p.y - d.y);
        if (dist < bd) { bd = dist; best = { type: "node", id }; }
      }
      return best;
    }
    let best = null, bd = 280;
    for (const id of Object.keys(stateRef.current.links)) {
      const L = LINK_DEFS[id];
      /* curved corridors: test against the two control-polygon segments */
      const segs = L.ctrl ? [[NODE_DEFS[L.from], L.ctrl], [L.ctrl, NODE_DEFS[L.to]]] : [[NODE_DEFS[L.from], NODE_DEFS[L.to]]];
      for (const [a, b] of segs) {
        const d2 = distToSeg(p, a, b);
        if (d2 < bd) { bd = d2; best = { type: "link", id }; }
      }
    }
    return best;
  }
  function startDrag(item, e) {
    const S = stateRef.current;
    if (S.phase !== "play") return;
    setDrawMode(null);
    const def = paletteDef(item);
    if (item.cat !== "draw") {
      const cost = Math.round(def.cost * (item.id === "battery" ? S.batteryDiscount : 1) * (item.cat === "asset" ? (S.costMult || 1) : 1));
      if (S.treasury < cost) {
        play("error");
        addToast(`💸 Can't afford ${def.name} (${fmtM(cost)})`, "bad");
        return;
      }
    }
    e.preventDefault();
    play("pick");
    dragRef.current = { item };
    setDragUI({ item, target: null });
    requestAnimationFrame(() => {
      if (ghostRef.current) {
        ghostRef.current.style.left = (e.clientX + 14) + "px";
        ghostRef.current.style.top = (e.clientY + 10) + "px";
      }
    });
  }
  useEffect(() => {
    if (!dragUI) return;
    const move = e => {
      if (ghostRef.current) {
        ghostRef.current.style.left = (e.clientX + 14) + "px";
        ghostRef.current.style.top = (e.clientY + 10) + "px";
      }
      const t = hitTest(dragRef.current.item, svgPoint(e.clientX, e.clientY));
      setDragUI(d => {
        if (!d) return d;
        const same = (d.target && t && d.target.type === t.type && d.target.id === t.id) || (!d.target && !t);
        return same ? d : { ...d, target: t };
      });
    };
    const up = e => {
      const item = dragRef.current && dragRef.current.item;
      const t = item ? hitTest(item, svgPoint(e.clientX, e.clientY)) : null;
      dragRef.current = null;
      setDragUI(null);
      if (!item) return;
      if (!t) { play("error"); return; }
      if (item.cat === "draw") {
        play("pick");
        addToast(`✏️ Anchored at ${NODE_DEFS[t.id].short} — click a destination region`, "info");
        setDrawMode({ from: t.id });
      }
      else if (item.cat === "asset") dispatch({ type: "build", nodeId: t.id, assetId: item.id });
      else dispatch({ type: "upgradeLink", linkId: t.id, upgradeId: item.id });
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    return () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
  }, [dragUI ? 1 : 0]);

  /* ---- corridor drawing completion ---- */
  function completeCorridor(from, to) {
    const S = stateRef.current;
    const rec = CORRIDORS[[from, to].sort().join("")];
    if (!rec) { play("error"); return; }
    if (rec.upgrade) { dispatch({ type: "upgradeLink", linkId: rec.upgrade, upgradeId: "hvdc" }); return; }
    if (S.links[rec.linkId] || S.linkQueue.some(q => q.linkId === rec.linkId)) {
      play("error"); addToast("That corridor already exists — drop 🧵 on it to upgrade", "bad"); return;
    }
    if (S.treasury < rec.cost) { play("error"); addToast(`💸 ${rec.label} costs ${fmtM(rec.cost)}`, "bad"); return; }
    play("cable");
    addToast(`✏️ ${rec.label}: ${rec.gw} GW in ${rec.delay} yr${rec.delay > 1 ? "s" : ""}`, "good");
    const next = {
      ...S,
      treasury: S.treasury - rec.cost,
      linkQueue: [...S.linkQueue, { uid: uid(), linkId: rec.linkId, addGW: rec.gw, turnsLeft: rec.delay, newLink: true, label: `${rec.label} ${rec.gw} GW` }],
      stats: { ...S.stats, corridors: S.stats.corridors + 1 },
      log: [...S.log, { year: S.year, tone: "info", text: `NEW CORRIDOR: ${rec.label} routed for ${fmtM(rec.cost)} — energises in ${rec.delay} yr${rec.delay > 1 ? "s" : ""}. Cartographers notified.` }],
    };
    if (rec.rebellion) {
      next.rebellion = clamp(S.rebellion + rec.rebellion, 0, 100);
      next.log = [...next.log, { year: S.year, tone: "warn", text: `BACKLASH: the ${rec.label} runs overhead through the fens. Rebellion +${rec.rebellion}%.` }];
    }
    setState(next);
  }

  /* ---- actions (closure-based via stateRef for sound + toast hooks) ---- */
  function dispatch(action) {
    const S = stateRef.current;
    switch (action.type) {
      case "begin":
        play("advance");
        setState({ ...S, phase: "play" });
        break;
      case "select":
        if (drawMode) {
          if (action.sel && action.sel.type === "node" && action.sel.id !== drawMode.from) {
            completeCorridor(drawMode.from, action.sel.id);
          } else {
            play("error");
            addToast("✏️ Route cancelled", "info");
          }
          setDrawMode(null);
          break;
        }
        setSelected(action.sel);
        if (action.sel) setMobilePane("build");   // surface the context menu on phones
        break;
      case "build": {
        const t = ASSET_TYPES[action.assetId];
        const def = NODE_DEFS[action.nodeId];
        const cost = Math.round(t.cost * (t.id === "battery" ? S.batteryDiscount : 1) * (S.costMult || 1));
        if (S.treasury < cost) { play("error"); addToast(`💸 Can't afford ${t.name}`, "bad"); break; }
        if (t.id === "offshore" && !def.offshoreOk) { play("error"); addToast("🌊 Offshore wind needs a coastline", "bad"); break; }
        if (t.id === "tidal" && !def.tidalOk) { play("error"); addToast("🌙 Tidal lagoons need an estuary or strong tidal coast", "bad"); break; }
        const yieldMult = t.kind === "battery" ? 1 : def.yields[t.kind];
        const effGW = r1(t.gw * yieldMult);
        const delay = S.policies.queueReform ? ECON.queueDelayReformed : ECON.queueDelayDefault;
        play("build");
        addToast(`${t.icon} ${t.name} ${effGW} GW → ${def.short} (${delay} yr)`, "good");
        setState({
          ...S,
          treasury: S.treasury - cost,
          nimby: { ...S.nimby, [action.nodeId]: clamp(S.nimby[action.nodeId] + t.nimby * def.nimbyFactor, 0, 100) },
          stats: { ...S.stats, built: S.stats.built + 1 },
          queue: [...S.queue, { uid: uid(), type: t.id, nodeId: action.nodeId, gw: effGW, turnsLeft: delay, label: `${t.name} ${effGW} GW` }],
          log: [...S.log, { year: S.year, tone: "info", text: `PROCUREMENT: ${t.name} (${effGW} GW) ordered at ${def.short} for ${fmtM(cost)}. Gate 1 entry — connects in ${delay} yr${delay > 1 ? "s" : ""}.` }],
        });
        break;
      }
      case "upgradeLink": {
        const u = LINK_UPGRADES[action.upgradeId];
        if (S.treasury < u.cost) { play("error"); addToast(`💸 Can't afford ${u.name}`, "bad"); break; }
        const def = LINK_DEFS[action.linkId];
        play("cable");
        addToast(`${u.icon} +${u.addGW} GW on ${def.name} (${u.delay} yr)`, "good");
        const next = {
          ...S,
          treasury: S.treasury - u.cost,
          linkQueue: [...S.linkQueue, { uid: uid(), linkId: action.linkId, addGW: u.addGW, turnsLeft: u.delay, label: `${u.name} +${u.addGW} GW` }],
          stats: { ...S.stats, pylons: S.stats.pylons + (u.id === "pylon" ? 1 : 0), hvdc: S.stats.hvdc + (u.id === "hvdc" ? 1 : 0) },
          log: [...S.log, { year: S.year, tone: u.id === "pylon" ? "warn" : "info", text: `TRANSMISSION: ${u.name} ordered on ${def.name} (+${u.addGW} GW, ${u.delay} yr) for ${fmtM(u.cost)}.` }],
        };
        if (u.rebellion > 0) {
          next.rebellion = clamp(S.rebellion + u.rebellion, 0, 100);
          next.nimby = { ...S.nimby, [def.from]: clamp(S.nimby[def.from] + 10, 0, 100), [def.to]: clamp(S.nimby[def.to] + 10, 0, 100) };
          next.log = [...next.log, { year: S.year, tone: "warn", text: `BACKLASH: pylon march announced along the ${def.name} corridor. Rebellion +${u.rebellion}%.` }];
        }
        setState(next);
        break;
      }
      case "innovate": {
        const def = INNOVATIONS.find(i => i.id === action.id);
        const cur = S.innovations[def.id];
        if (!cur || cur.status !== "idle") break;
        if (S.treasury < def.cost || S.pc < def.pc) { play("error"); addToast("💸 The Skunkworks needs funding AND favours", "bad"); break; }
        play("lab");
        const next = {
          ...S,
          treasury: S.treasury - def.cost,
          pc: clamp(S.pc - def.pc, 0, 100),
          innovations: { ...S.innovations },
          stats: { ...S.stats, innovations: S.stats.innovations + 1 },
          log: [...S.log, { year: S.year, tone: "warn", text: `SKUNKWORKS: "${def.name}" greenlit for ${fmtM(def.cost)}${def.pc ? ` and ${def.pc} PC` : ""}. ${def.years === 0 ? "Effective immediately." : `Results in ${def.years} yr — ${Math.round(def.odds * 100)}% odds.`}` }],
        };
        if (def.onLaunch) def.onLaunch(next);
        if (def.years === 0) {
          next.assets = next.assets.slice();
          next.nimby = { ...next.nimby };
          next.stats = { ...next.stats };
          if (Math.random() < def.odds) {
            next.innovations[def.id] = { status: "done", turnsLeft: 0 };
            def.apply(next);
            next.log = [...next.log, { year: S.year, tone: "good", text: def.winLog }];
            addToast(`${def.icon} ${def.name}: DEPLOYED`, "good");
          } else {
            next.innovations[def.id] = { status: "failed", turnsLeft: 0 };
            if (def.failApply) def.failApply(next);
            next.log = [...next.log, { year: S.year, tone: "bad", text: def.failLog }];
            addToast(`${def.icon} ${def.name}: FAILED`, "bad");
          }
        } else {
          next.innovations[def.id] = { status: "building", turnsLeft: def.years };
          addToast(`${def.icon} ${def.name}: under construction`, "good");
        }
        setState(next);
        break;
      }
      case "policy": {
        const P = POLICIES.find(p => p.id === action.id);
        if (!P || S.policies[P.id] || S.pc < P.pc || S.treasury < P.cost) { play("error"); break; }
        const next = {
          ...S,
          pc: clamp(S.pc - P.pc, 0, 100),
          treasury: S.treasury - P.cost,
          policies: { ...S.policies, [P.id]: true },
        };
        let logText = "";
        switch (P.id) {
          case "queueReform":
            next.rebellion = clamp(S.rebellion + 12, 0, 100);
            next.queue = S.queue.map(q => ({ ...q, turnsLeft: Math.min(q.turnsLeft, ECON.queueDelayReformed) }));
            logText = "GATED QUEUE REFORM ENACTED: zombie projects culled, connections now 1 year. Industry lawyers issue 47 furious press releases.";
            break;
          case "carbonLevy":
            next.rebellion = clamp(S.rebellion + 6, 0, 100);
            logText = "CARBON LEVY INTRODUCED: +£300m/yr, wholesale +1.2p, gas fleet begins early retirement.";
            break;
          case "smartTariffs":
            next.demandExtra = S.demandExtra - 2;
            logText = "SMART TARIFFS LIVE: the nation's car batteries now haggle with the grid at 2am. Demand −2 GW, forever.";
            break;
          case "communityFund":
            next.nimbyDecayMult = 2;
            logText = "COMMUNITY WEALTH FUND: anyone who can see a turbine gets cheap bills. Objections mysteriously soften — NIMBY decays twice as fast.";
            break;
          case "skillsAcademy":
            next.costMult = 0.9;
            logText = "GREEN SKILLS ACADEMY: 40,000 new sparkies and cable-jointers. Every future asset build 10% cheaper. The unions send cake.";
            break;
          case "strategicReserve":
            next.gasFleet = S.gasFleet + 4;
            next.rebellion = clamp(S.rebellion + 6, 0, 100);
            next.approval = clamp(S.approval - 3, 0, 100);
            logText = "STRATEGIC GAS RESERVE: +4 GW of mothballed CCGT back on standby. Greenpeace scales the Department roof by lunchtime.";
            break;
          case "porkBarrel":
            next.rebellion = clamp(S.rebellion - 12, 0, 100);
            next.approval = clamp(S.approval + 4, 0, 100);
            next.nimby = { A: clamp(S.nimby.A - 10, 0, 100), B: clamp(S.nimby.B - 10, 0, 100), C: clamp(S.nimby.C - 10, 0, 100), D: clamp(S.nimby.D - 10, 0, 100), E: clamp(S.nimby.E - 10, 0, 100) };
            logText = "PORK BARREL: £350m of suspiciously well-targeted infrastructure. Rebellion −12%, NIMBY −10 everywhere. Nobody asks questions.";
            break;
          case "reshuffle":
            next.rebellion = clamp(S.rebellion - 25, 0, 100);
            next.approval = clamp(S.approval - 3, 0, 100);
            logText = "NIGHT OF THE LONG KNIVES: three ringleaders now hold ministerial briefs for Paperclips, Fog, and the Census. Rebellion −25%.";
            break;
          case "heatPumpMandate":
            next.demandExtra = S.demandExtra + 3;
            next.approval = clamp(S.approval + 4, 0, 100);
            logText = "HEAT PUMP MANDATE: 15 million homes electrified by 2031. Demand +3 GW permanently, but the green infrastructure rebate adds £150m/yr income. +4 Approval.";
            break;
          case "dsr":
            next.demandExtra = S.demandExtra - 3;
            logText = "DEMAND-SIDE RESPONSE: national industrial aggregation live. Peak demand −3 GW forever. Factories learn to flex. The grid says thank you.";
            break;
          default: break;
        }
        next.log = [...S.log, { year: S.year, tone: "warn", text: logText }];
        play("cable");
        addToast(`📜 ${P.name}`, "good");
        setState(next);
        break;
      }
      case "whips": {
        if (S.whipsUsed || S.pc < 15) { play("error"); break; }
        play("build");
        addToast("🥃 Whips deployed: Rebellion −15%", "good");
        setState({
          ...S, pc: S.pc - 15, rebellion: clamp(S.rebellion - 15, 0, 100), whipsUsed: true,
          log: [...S.log, { year: S.year, tone: "good", text: "WHIPS' OPERATION: late-night calls, two knighthood hints, one upgraded office. Rebellion −12%." }],
        });
        break;
      }
      case "borrow": {
        if (S.loanUsed || S.loan) { play("error"); break; }
        const yearsLeft = Math.max(1, ECON.totalYears - S.year + 1);
        const PRINCIPAL = 1800, INTEREST = 1.25;
        const perYear = Math.ceil((PRINCIPAL * INTEREST) / yearsLeft);
        play("build");
        addToast(`💷 National Grid Bond: +${fmtM(PRINCIPAL)} now`, "good");
        setState({
          ...S,
          treasury: S.treasury + PRINCIPAL,
          loanUsed: true,
          loan: { perYear, yearsLeft },
          log: [...S.log, { year: S.year, tone: "warn", text: `NATIONAL GRID BOND: ${fmtM(PRINCIPAL)} raised on the markets. Repayments of ${fmtM(perYear)}/yr for ${yearsLeft} years (${fmtM(Math.round(PRINCIPAL * INTEREST))} total). The Chancellor signs with a heavy hand.` }],
        });
        break;
      }
      case "setName":
        if (typeof window !== "undefined") window.__gridlockName = action.name;
        setState({ ...S, playerName: action.name });
        break;
      case "advance": {
        if (S.phase !== "play") break;
        play("crisis");
        const card = S.deck[(S.year - 1) % S.deck.length];
        setState({ ...S, phase: "crisis", activeCrisis: card });
        break;
      }
      case "crisisChoice": {
        const { state: afterCrisis, mods } = applyCrisisChoice(S, action.fx);
        if (afterCrisis.treasury < 0) {
          play("lose");
          setState({ ...afterCrisis, phase: "dead", activeCrisis: null, gameOver: { type: "bankrupt", detail: `The crisis response overdrew the Treasury (${fmtM(afterCrisis.treasury)}).` } });
          break;
        }
        if (afterCrisis.rebellion >= 100) {
          play("lose");
          setState({ ...afterCrisis, phase: "dead", activeCrisis: null, gameOver: { type: "coup", detail: "The crisis decision was the final straw. The letters went in that afternoon." } });
          break;
        }
        const next = resolveYear({ ...afterCrisis, activeCrisis: null }, mods);
        [50, 75, 100].forEach(m => {
          if (S.netZero < m && next.netZero >= m) {
            addToast(`🎉 MILESTONE: ${m}% NET ZERO!`, "good");
          }
        });
        if (next.gameOver) { play("lose"); shake(); }
        else if (next.phase === "report") { play("win"); }
        else if (next.lastYear && next.lastYear.unserved > 0) { play("alarm"); shake(); addToast("🕯 BROWNOUTS — the lights flickered", "bad"); }
        else if (next.netZero >= 100 || (S.netZero < 75 && next.netZero >= 75)) { play("win"); }
        else { play("advance"); }
        if (next.lastYear && next.lastYear.flows.curtailed > 0.05 && !next.gameOver) {
          addToast(`🔥 Curtailed ${fmtGW(next.lastYear.flows.curtailed)} — fined ${fmtM(next.lastYear.fine)}`, "bad");
        }
        setState(next);
        setSelected(null);
        break;
      }
      case "chooseScenario":
        setState(initialState(action.id));
        break;
      case "restart":
        setState(initialState());
        setSelected(null);
        setTab("national");
        break;
      default: break;
    }
  }

  const advisorTone = advise(state, flows).tone;
  const busy = state.phase !== "play";
  const NavBtn = ({ id, icon, label, badge }) => (
    <button onClick={() => setMobilePane(id)}
      className={`relative flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-lg transition ${mobilePane === id ? "bg-slate-700 text-slate-100" : "text-slate-400 active:bg-slate-800"}`}>
      <span className="text-lg leading-none">{icon}</span>
      <span className="text-[10px] font-bold tracking-wide">{label}</span>
      {badge && <span className="absolute top-1 right-3 w-2 h-2 rounded-full bg-amber-400 blink" />}
    </button>
  );

  return (
    <div className={`h-app w-screen flex flex-col bg-[#0f172a] text-slate-100 overflow-hidden ${shaking ? "shake" : ""}`}>
      <Header s={state} muted={muted} onToggleMute={() => setMuted(m => !m)} />
      <div className="flex-1 min-h-0 flex flex-col p-2 lg:p-3 lg:pb-0 gap-2 lg:gap-3">
        {/* map + command: 2-up on desktop, swappable panes on mobile */}
        <div className={`${mobilePane === "national" ? "hidden" : "flex-1"} min-h-0 lg:grid lg:grid-cols-[minmax(0,5fr)_minmax(0,4fr)] lg:gap-3 lg:flex-1`}>
          <div className={`${mobilePane === "map" ? "flex" : "hidden"} lg:flex h-full min-h-0`}>
            <MapPanel state={state} flows={flows} selected={selected} onSelect={sel => dispatch({ type: "select", sel })}
                      svgRef={svgRef} dragUI={dragUI} onStartDrag={startDrag} drawMode={drawMode} rubberRef={rubberRef} />
          </div>
          {/* Mobile BUILD pane: node/link detail when selected, Skunkworks otherwise */}
          <div className={`${mobilePane === "build" ? "flex" : "hidden"} lg:hidden h-full min-h-0 w-full`}>
            <div className="h-full w-full flex flex-col bg-[#1e293b] rounded-xl border border-slate-700 overflow-hidden">
              <div className="px-3 py-2 border-b border-slate-700 shrink-0 flex items-center justify-between">
                <div className="text-xs font-bold tracking-widest text-slate-300">
                  {selected ? (selected.type === "node" ? `NODE ${selected.id} — ${NODE_DEFS[selected.id].short}` : LINK_DEFS[selected.id].name.toUpperCase()) : "🧪 SKUNKWORKS LAB"}
                </div>
                {selected && <button onClick={() => dispatch({ type: "select", sel: null })} className="text-[10px] text-sky-400 hover:text-sky-300">← back</button>}
              </div>
              <div className="scroll-y flex-1 min-h-0 p-3 pb-24">
                {selected && selected.type === "node" && <NodeTab state={state} flows={flows} nodeId={selected.id} dispatch={dispatch} />}
                {selected && selected.type === "link" && <LinkTab state={state} flows={flows} linkId={selected.id} dispatch={dispatch} />}
                {!selected && (
                  <>
                    <div className="text-[10px] text-slate-500 italic mb-3 px-1">Tap a region or line on the map to build and upgrade. While you're here, launch some science.</div>
                    <LabTab state={state} dispatch={dispatch} />
                  </>
                )}
              </div>
            </div>
          </div>
          {/* Desktop right panel (national+lab+node tabs) */}
          <div className="hidden lg:flex h-full min-h-0">
            <RightPanel state={state} flows={flows} selected={selected} tab={tab} setTab={setTab} dispatch={dispatch} />
          </div>
        </div>
        {/* NATIONAL pane (mobile only) — national dashboard + advisor, replaces wire/news reel */}
        <div className={`${mobilePane === "national" ? "flex flex-1 min-h-0" : "hidden"} lg:hidden flex-col gap-2`}>
          <AdvisorBar state={state} flows={flows} />
          <div className="scroll-y flex-1 min-h-0 bg-[#1e293b] rounded-xl border border-slate-700">
            <div className="p-3 pb-24">
              <DefaultTab state={state} flows={flows} dispatch={dispatch} />
            </div>
          </div>
        </div>
        {/* Westminster Wire + Advance: desktop only (hidden on mobile) */}
        <div className="hidden lg:flex lg:flex-none flex-col">
          <AdvisorBar state={state} flows={flows} />
          <Console state={state} dispatch={dispatch} />
        </div>
      </div>
      {/* mobile bottom navigation */}
      <nav className="lg:hidden shrink-0 flex items-stretch gap-1.5 px-2 py-1.5 bg-[#1e293b] border-t border-slate-700" style={{ paddingBottom: "calc(0.375rem + env(safe-area-inset-bottom))" }}>
        <NavBtn id="map" icon="🗺️" label="MAP" />
        <NavBtn id="build" icon="🏗️" label="BUILD" badge={!!selected} />
        <NavBtn id="national" icon="📊" label="NATIONAL" badge={advisorTone === "bad" || advisorTone === "warn"} />
        <button onClick={() => dispatch({ type: "advance" })} disabled={busy}
          className="flex-[1.4] flex flex-col items-center justify-center rounded-lg bg-green-600 active:bg-green-500 disabled:bg-slate-700 disabled:text-slate-500 text-slate-900 font-bold transition">
          <span className="text-base leading-none">⏭ ADVANCE</span>
          <span className="text-[10px] font-term opacity-80">{state.year >= 12 ? "FINAL AUDIT" : `FY${state.year} → ${state.year + 1}`}</span>
        </button>
      </nav>
      <Toasts toasts={toasts} />
      <DragGhost ghostRef={ghostRef} dragUI={dragUI} />
      {state.phase === "intro" && <IntroModal state={state} dispatch={dispatch} />}
      {state.phase === "crisis" && <CrisisModal state={state} dispatch={dispatch} />}
      {state.phase === "dead" && state.gameOver && <GameOverModal state={state} dispatch={dispatch} />}
      {state.phase === "report" && <ReportModal state={state} dispatch={dispatch} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
