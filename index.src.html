let _audio = null;
function sfx(kind, muted) {
  if (muted) return;
  try {
    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audio;
    const note = (freq, start, dur, type, gain) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      g.gain.linearRampToValueAtTime(gain || 0.05, ctx.currentTime + start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + 0.05);
    };
    switch (kind) {
      case "pick":    note(440, 0, 0.06, "sine", 0.05); break;
      case "build":   note(110, 0, 0.12, "sine", 0.14); note(70, 0.05, 0.16, "sine", 0.12); note(880, 0.02, 0.05, "sine", 0.03); break;
      case "cable":   note(220, 0, 0.07, "sawtooth", 0.04); note(330, 0.07, 0.07, "sawtooth", 0.04); note(440, 0.14, 0.1, "sawtooth", 0.04); break;
      case "error":   note(150, 0, 0.15, "sawtooth", 0.06); note(110, 0.12, 0.2, "sawtooth", 0.06); break;
      case "advance": note(262, 0, 0.08, "sine", 0.06); note(330, 0.08, 0.08, "sine", 0.06); note(392, 0.16, 0.14, "sine", 0.06); break;
      case "crisis":  note(740, 0, 0.13, "square", 0.045); note(587, 0.18, 0.18, "square", 0.045); break;
      case "alarm":   note(880, 0, 0.1, "square", 0.05); note(880, 0.2, 0.1, "square", 0.05); note(880, 0.4, 0.1, "square", 0.05); break;
      case "win":     [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.11, 0.22, "triangle", 0.07)); break;
      case "lose":    [392, 330, 262, 196].forEach((f, i) => note(f, i * 0.16, 0.3, "triangle", 0.07)); break;
      case "lab":     note(660, 0, 0.06, "sine", 0.05); note(990, 0.07, 0.06, "sine", 0.05); note(1320, 0.14, 0.1, "sine", 0.05); break;
      default: break;
    }
  } catch (e) { /* audio unavailable — play on in silence */ }
}

const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ------------------------ physics / flow engine ------------------------ */
function nodeGen(state, nodeId, windCF, solarCF) {
  let windCap = 0, solarCap = 0, nuclear = 0, battery = 0, tidal = 0, gen = 0;
  for (const a of state.assets) {
    if (a.nodeId !== nodeId) continue;
    if (a.kind === "wind") { windCap += a.gw; gen += a.gw * (a.dunkelProof ? Math.max(windCF, 0.85) : windCF); }
    else if (a.kind === "solar") { solarCap += a.gw; gen += a.gw * solarCF; }
    else if (a.kind === "nuclear") { nuclear += a.gw; gen += a.gw; }
    else if (a.kind === "tidal") { tidal += a.gw; gen += a.gw * 0.92; }  // tides: firm & predictable, ~92% capacity factor
    else if (a.kind === "battery") { battery += a.gw; }
  }
  return { windCap, solarCap, nuclear, battery, tidal, gen };
}

function totalsByKind(state) {
  const t = { wind: 0, solar: 0, nuclear: 0, battery: 0, tidal: 0 };
  for (const a of state.assets) t[a.kind] += a.gw;
  return t;
}

function computeFlows(state, windCF, solarCF) {
  const demand = demandForYear(state.year, state.demandExtra);
  const dem = {};
  for (const id of ["A", "B", "C", "D", "E"]) dem[id] = demand * NODE_DEFS[id].demandShare;
  dem.D += state.demandExtraD;
  const demandTotal = demand + state.demandExtraD;

  const g = {};
  for (const id of ["A", "B", "C", "D", "E"]) g[id] = nodeGen(state, id, windCF, solarCF);

  const capOf = id => (state.links[id] ? state.links[id].cap : 0);

  /* Scotland exports: boundary first, then the drawn corridors */
  const surplusA = Math.max(0, g.A.gen - dem.A);
  const flow1 = Math.min(surplusA, capOf("L1"));                       // A → B
  let remA = surplusA - flow1;
  const flowX1 = Math.min(remA, capOf("X1")); remA -= flowX1;          // A → D direct subsea
  const flowX2 = Math.min(remA, capOf("X2")); remA -= flowX2;          // A → C pool
  const absorbA = Math.min(remA, g.A.battery * ECON.batteryFirmFactor);
  const curtailA = remA - absorbA;

  /* East Anglia pool (own gen + Scottish inflow) exports south then west */
  const poolC = g.C.gen + flowX2;
  const surplusC = Math.max(0, poolC - dem.C);
  const flow2 = Math.min(surplusC, capOf("L2"));                       // C → D
  let remC = surplusC - flow2;
  const flowX3 = Math.min(remC, capOf("X3")); remC -= flowX3;          // C → B pool
  const absorbC = Math.min(remC, g.C.battery * ECON.batteryFirmFactor);
  const curtailC = remC - absorbC;

  /* South Wales exports east to the Midlands, or south to London via the Severn link */
  const surplusE = Math.max(0, g.E.gen - dem.E);
  const flow4 = Math.min(surplusE, capOf("L4"));                       // E → B
  let remE = surplusE - flow4;
  const flowX4 = Math.min(remE, capOf("X4")); remE -= flowX4;          // E → D direct subsea
  const absorbE = Math.min(remE, g.E.battery * ECON.batteryFirmFactor);
  const curtailE = remE - absorbE;

  /* Midlands pool re-exports to London */
  const availB = g.B.gen + flow1 + flowX3 + flow4;
  const surplusB = Math.max(0, availB - dem.B);
  const flow3 = Math.min(surplusB, capOf("L3"));                       // B → D
  let remB = surplusB - flow3;
  const absorbB = Math.min(remB, g.B.battery * ECON.batteryFirmFactor);
  const curtailB = remB - absorbB;

  const curtailed = curtailA + curtailB + curtailC + curtailE;
  const cleanGen = g.A.gen + g.B.gen + g.C.gen + g.D.gen + g.E.gen;
  const cleanDelivered = Math.max(0, cleanGen - curtailed);
  const t = totalsByKind(state);
  const batteryFirm = t.battery * ECON.batteryFirmFactor;
  const gasNeeded = Math.max(0, demandTotal - cleanDelivered - batteryFirm - state.firmImports);

  return {
    demand: demandTotal, dem, g, flow1, flow2, flow3, flow4,
    byLink: { L1: flow1, L2: flow2, L3: flow3, L4: flow4, X1: flowX1, X2: flowX2, X3: flowX3, X4: flowX4 },
    curtailA, curtailB, curtailC, curtailE, curtailed,
    cleanGen, cleanDelivered, batteryFirm, gasNeeded, totals: t,
  };
}

function intermittencyRisk(state, demand) {
  const t = totalsByKind(state);
  const variable = t.wind + t.solar;
  const firm = (t.nuclear + t.tidal + t.battery + state.firmImports) * state.firmMult;
  return clamp(((variable - firm) / Math.max(demand, 1)) * 100, 0, 99);
}

function copyLinks(links) {
  const out = {};
  for (const k in links) out[k] = { ...links[k] };
  return out;
}

function applyCrisisChoice(state, fx) {
  const s = { ...state, nimby: { ...state.nimby }, stats: { ...state.stats }, policies: { ...state.policies }, links: copyLinks(state.links) };
  s.queue = state.queue.map(q => ({ ...q }));
  s.linkQueue = state.linkQueue.map(q => ({ ...q }));
  const mods = { windOverride: null, priceShock: 0, tempFleet: 0 };
  const logs = [];
  const L = (tone, text) => logs.push({ year: s.year, tone, text });

  switch (fx) {
    case "none": L("info", "MINISTERIAL BOX: no action taken. The red box closes with a satisfying thunk."); break;
    case "broke":
      s.approval = clamp(s.approval - 4, 0, 100); s.rebellion = clamp(s.rebellion + 4, 0, 100);
      L("warn", "TREASURY STRETCHED: no funds for a grand gesture. The crisis is weathered on a wing and a prayer. −4 Approval, +4% Rebellion.");
      break;
    case "pylonYield":
      s.treasury -= 400; s.approval = clamp(s.approval + 6, 0, 100); s.stats.underground++;
      s.linkQueue.forEach(q => q.turnsLeft += 1);
      L("warn", "PYLON REVOLT: route undergrounded. −£400m, link upgrades slip a year. The gardener sends flowers.");
      break;
    case "pylonForce":
      s.rebellion = clamp(s.rebellion + 18, 0, 100); s.approval = clamp(s.approval - 4, 0, 100); s.stats.pylons++;
      s.linkQueue.forEach(q => { if (q.label && q.label.toLowerCase().includes("pylon")) q.turnsLeft = Math.max(0, q.turnsLeft - 1); });
      L("bad", "PYLON REVOLT: overhead lines forced through. +18% Rebellion, −4 Approval. Queued pylon upgrades deliver 1 year early. Effigies in three constituencies.");
      break;
    case "lng":
      s.treasury -= 350; mods.windOverride = 0.05; mods.tempFleet = 60;
      L("warn", "DUNKELFLAUTE: £350m of emergency LNG chartered. Every tanker in the Atlantic redirected. Expensive, but the lights stay on; the Treasury does not smile.");
      break;
    case "rideOut":
      mods.windOverride = 0.05; mods.tempDemand = 4;
      s.approval = clamp(s.approval - 5, 0, 100); s.rebellion = clamp(s.rebellion + 8, 0, 100);
      L("bad", "DUNKELFLAUTE: no bailout purchased. Wind at 5% AND the cold snap is adding 4 GW of heating load. Every GW of nuclear and batteries you built is being tested. −5 Approval, +8% Rebellion from a nervous public.");
      break;
    case "dcApprove":
      s.treasury += 250; s.pc = clamp(s.pc + 5, 0, 100); s.demandExtraD += 2;
      L("warn", "DATA CENTRE: campus approved. +£250m, +5 PC. London demand permanently +2 GW. The forecasters update their CVs.");
      break;
    case "dcBlock":
      s.pc = clamp(s.pc - 8, 0, 100); s.approval = clamp(s.approval - 3, 0, 100);
      L("info", "DATA CENTRE: blocked on capacity grounds. The Chancellor's thank-you note is notably absent.");
      break;
    case "viking":
      s.treasury -= 650; s.firmImports += 2;
      L("good", "INTERCONNECTOR: Viking link signed. +2 GW of firm Norwegian hydro now backs the system.");
      break;
    case "gasSubsidise":
      s.treasury -= 400; s.approval = clamp(s.approval + 7, 0, 100); mods.priceShock = 2.5;
      L("warn", "GAS SHOCK: bills subsidised (−£400m). Wholesale still spikes +2.5p but the public notices the cushion.");

    case "gasHold":
      s.rebellion = clamp(s.rebellion + 10, 0, 100); s.approval = clamp(s.approval - 6, 0, 100); mods.priceShock = 2.5;

      s.treasury -= 220;
      L("info", "JUDICIAL REVIEW: settled for £220m. The newts remain undisturbed and unconsulted.");

        L("good", "JUDICIAL REVIEW: WON in the High Court. +8 PC. The newt survey is ruled inadmissible.");

    case "smrFund": {
      s.treasury -= 420;
      const delay = s.policies.queueReform ? ECON.queueDelayReformed : ECON.queueDelayDefault;
      s.queue.push({ uid: uid(), type: "smr", nodeId: "B", gw: 1.8, turnsLeft: delay, label: "SMR Nuclear 1.8 GW (co-funded)" });
      L("good", `SMR DEAL: 1.8 GW co-funded reactor enters the Midlands queue (${delay} yr to connect).`);
      break;
    }
    case "stormFix":
      s.treasury -= 180;
      L("info", "STORM BRYN: £180m hardening programme. Lines re-strung, engineers exhausted, grid intact.");
      break;
    case "stormDefer": {
      const ids = ["L1", "L2", "L3"];
      const hit = ids[Math.floor(Math.random() * 3)];
      s.links[hit].cap = Math.max(1, s.links[hit].cap - 1);
      s.rebellion = clamp(s.rebellion + 6, 0, 100);
      L("bad", `STORM BRYN: maintenance deferred. ${LINK_DEFS[hit].name} permanently loses 1 GW. Rebellion +6%.`);
      break;
    }
    case "copBack":
      s.pc = clamp(s.pc + 10, 0, 100); s.rebellion = clamp(s.rebellion + 8, 0, 100);
      L("warn", "COP: pledge backed. +10 PC from No.10; +8% Rebellion from everyone behind you.");
      break;
    case "copQuiet":
      s.pc = clamp(s.pc - 6, 0, 100);
      L("info", "COP: pledge quietly smothered. −6 PC. No.10's texts become noticeably terser.");
      break;
    case "teaCharm":
      s.pc = clamp(s.pc - 15, 0, 100); s.rebellion = clamp(s.rebellion - 18, 0, 100);
      L("good", "1922 COMMITTEE: tea, flattery, and selective honesty. Rebellion Risk −18%.");
      break;
    case "gigaFund":
      s.treasury -= 300; s.batteryDiscount = 0.75; s.approval = clamp(s.approval + 4, 0, 100);
      L("good", "GIGAFACTORY: order book anchored. All future Battery Hubs cost −25%. 'BRITISH BATTERIES BOOM'.");
      break;
    case "evBack":
      s.pc = clamp(s.pc + 8, 0, 100); s.approval = clamp(s.approval + 4, 0, 100); s.demandExtra += 1.5;
      L("warn", "EV MANDATE: accelerated. +8 PC, +4 Approval. National demand permanently +1.5 GW.");
      break;
    case "evDelay":
      s.pc = clamp(s.pc - 6, 0, 100); s.approval = clamp(s.approval - 4, 0, 100);
      L("info", "EV MANDATE: delayed. The green lobby projects your face onto Battersea Power Station. Unflatteringly.");
      break;
    case "doggerFix":
      s.treasury -= 300;
      L("info", "DOGGER REPAIR: £300m emergency contract signed. L2 fully restored next year. The cable-layers earn their Christmas bonus.");
      break;
    case "doggerDefer": {
      if (!s.links.L2) s.links.L2 = { cap: 6 };
      s.links.L2.cap = Math.max(1, s.links.L2.cap - 2);
      L("bad", `DOGGER DEFERRED: L2 derated to ${r1(s.links.L2.cap)} GW. Curtailment fines incoming from Scotland. Hope the wind stays light.`);
      break;
    }
    case "scotTariffAccept":
      s.treasury -= 200; s.scotTariff = true;
      L("warn", "SCOTTISH TARIFF: −£200m p.a. agreement signed. Grid integrity guaranteed. The Chancellor has flagged the new line item with visible displeasure.");
      break;
    case "scotBuild":
      s.treasury -= 800;
      if (!s.links.L1) s.links.L1 = { cap: 4 };
      s.links.L1.cap += 2;
      L("good", "QUEENSFERRY COUNTER: £800m investment, +2 GW on Scotland→Midlands permanently. Edinburgh and London simultaneously issue identical press releases claiming full credit.");
      break;
    case "scotRefuse":
      s.rebellion = clamp(s.rebellion + 8, 0, 100); s.approval = clamp(s.approval - 3, 0, 100);
      L("warn", "SCOTTISH STAND-OFF: tariff refused. Holyrood threatens a Section 30 strop. +8% Rebellion, −3 Approval. No money changes hands.");
      break;
    case "evSurgeLng":
      s.treasury -= 200; mods.tempFleet = 8;
      L("info", "EV SURGE: £200m emergency balancing deployed. The nation charges its cars in peace. The grid holds. The Treasury does not smile.");
      break;
    case "evSurgeCurtail":
      s.approval = clamp(s.approval - 4, 0, 100); s.rebellion = clamp(s.rebellion + 6, 0, 100);
      L("warn", "EV SURGE: demand curtailment invoked. The chargers blink off at 10pm. −4 Approval, +6% Rebellion. The Daily Mail runs a photo of a man looking at his car.");
      break;
    default: break;
  }
  s.log = [...state.log, ...logs];
  return { state: s, mods };
}

/* --------------------------- year resolution --------------------------- */
function resolveYear(prev, mods) {
  const s = {
    ...prev,
    nimby: { ...prev.nimby }, stats: { ...prev.stats },
    links: copyLinks(prev.links),
    assets: prev.assets.slice(), queue: [], linkQueue: [], innovations: {},
  };
  for (const [id, st] of Object.entries(prev.innovations)) s.innovations[id] = { ...st };
  const logs = [];
  const L = (tone, text) => logs.push({ year: prev.year, tone, text });

  /* 1 — connections queue ticks down */
  for (const q of prev.queue) {
    const left = q.turnsLeft - 1;
    if (left <= 0) {
      s.assets.push(makeAsset(q.type, q.nodeId, q.gw));
      if (q.type === "battery") s.stats.batteriesGW += q.gw;
      L("good", `ENERGISED: ${q.label} connects at ${NODE_DEFS[q.nodeId].short}. First power flows.`);
    } else s.queue.push({ ...q, turnsLeft: left });
  }
  for (const q of prev.linkQueue) {
    const left = q.turnsLeft - 1;
    if (left <= 0) {
      if (!s.links[q.linkId]) s.links[q.linkId] = { cap: 0 };
      s.links[q.linkId].cap += q.addGW;
      L("good", `${q.newLink ? "CORRIDOR ENERGISED" : "COMMISSIONED"}: ${q.label} — ${LINK_DEFS[q.linkId].name} now ${s.links[q.linkId].cap} GW.`);
    } else s.linkQueue.push({ ...q, turnsLeft: left });
  }

  /* 2 — skunkworks projects resolve */
  for (const id in s.innovations) {
    const st = s.innovations[id];
    if (st.status !== "building") continue;
    st.turnsLeft -= 1;
    if (st.turnsLeft > 0) continue;
    const def = INNOVATIONS.find(i => i.id === id);
    if (Math.random() < def.odds) {
      st.status = "done";
      def.apply(s);
      L("good", def.winLog);
    } else {
      st.status = "failed";
      if (def.failApply) def.failApply(s);
      L("bad", def.failLog);
    }
  }

  /* 3 — weather: the Met Office outlook published last year IS this year's wind */
  const windCF = mods.windOverride != null ? mods.windOverride : prev.windNext;
  const solarCF = 0.8 + Math.random() * 0.2;
  s.windNext = Math.round((0.75 + Math.random() * 0.3) * 100) / 100;

  /* 4 — physics */
  const f = computeFlows(s, windCF, solarCF);
  const tempDemandExtra = mods.tempDemand || 0;  // e.g. heating spike during Dunkelflaute
  const fleetAvail = s.gasFleet + (mods.tempFleet || 0);
  const extraGasNeeded = f.gasNeeded + tempDemandExtra;
  const gasFired = Math.min(extraGasNeeded, fleetAvail);
  const unserved = extraGasNeeded - gasFired;

  /* 5 — money */
  const income = ECON.baseIncome + (prev.year - 1) * 30 + (s.policies.carbonLevy ? 300 : 0)
    + (s.policies.heatPumpMandate ? 150 : 0) - (s.scotTariff ? 200 : 0) + (s.baseIncomeBonus || 0);
  const gasCost = gasFired * ECON.gasFuelCostPerGW;
  const fine = f.curtailed * ECON.curtailFinePerGW;
  /* loan repayment — borrowed capital is paid back in equal instalments */
  let loanPayment = 0;
  if (s.loan && s.loan.yearsLeft > 0) {
    loanPayment = s.loan.perYear;
    const yearsLeft = s.loan.yearsLeft - 1;
    s.loan = yearsLeft > 0 ? { ...s.loan, yearsLeft } : null;
    if (yearsLeft <= 0) L("good", "DEBT CLEARED: the National Grid Bond is repaid in full. The bond markets exhale.");
  }
  s.treasury = s.treasury + income - gasCost - fine - loanPayment;
  s.stats.fines += fine; s.stats.curtailed += f.curtailed; s.stats.gasBurned += gasFired;

  if (f.curtailed > 0.05) {
    L("bad", `CURTAILMENT: ${fmtGW(f.curtailed)} of clean power dumped at saturated boundaries. Constraint penalty ${fmtM(fine)}. Gas peakers spin up in the South to cover the gap.`);
  }

  /* 6 — price */
  s.price = r1(ECON.priceBase + gasFired * ECON.pricePerGasGW + f.curtailed * ECON.pricePerCurtailGW
            + (s.policies.carbonLevy ? ECON.levyPriceAdd : 0) + (mods.priceShock || 0));
  s.stats.peakPrice = Math.max(s.stats.peakPrice, s.price);

  /* 7 — net zero + intermittency */
  const effectiveDemand = f.demand + tempDemandExtra;
  s.netZero = r1(clamp((1 - gasFired / effectiveDemand) * 100, 0, 100));
  s.intermittency = r1(intermittencyRisk(s, effectiveDemand));
  s.netZeroHistory = [...(prev.netZeroHistory || []).slice(-11), s.netZero];

  /* 8 — public mood */
  let dApproval = 0, dRebellion = 0;
  if (s.price > 18) { dApproval -= 8; dRebellion += 6; L("bad", `BILLS CRISIS: wholesale at ${fmtP(s.price)}. Marginal gas is setting the price of everything. The public is furious.`); }
  else if (s.price > 14) { dApproval -= 4; dRebellion += 3; L("warn", `PRICE PRESSURE: wholesale at ${fmtP(s.price)} — gas on the margin keeps bills high.`); }
  else if (s.price < 10) { dApproval += 3; }
  if (s.intermittency > 40) { dApproval -= 6; dRebellion += 4; L("bad", `GRID INSTABILITY: intermittency risk at ${s.intermittency}%. Frequency excursions reported. Build firm capacity (nuclear / batteries).`); }
  if (s.approval + dApproval < 30) dRebellion += 5;

  for (const id of ["A", "B", "C", "D", "E"]) {
    if (s.nimby[id] > 70) { dRebellion += 2; L("warn", `NIMBY FLASHPOINT: opposition in ${NODE_DEFS[id].short} at ${Math.round(s.nimby[id])}%. Local MPs are tabling motions.`); }
    s.nimby[id] = clamp(s.nimby[id] - ECON.nimbyDecay * (s.nimbyDecayMult || 1), 0, 100);
  }
  /* the benches always cool slightly between flashpoints */
  dRebellion -= 3;
  if (dRebellion <= -3 && f.curtailed < 0.05 && unserved <= 0) {
    dRebellion -= 4; L("good", "QUIET YEAR ON THE BENCHES: competence breeds calm. Rebellion Risk easing.");
  }
  if (s.approval + dApproval >= 50) {
    dRebellion -= 3; // a popular chairman is a safe chairman
  }
  s.approval = clamp(s.approval + dApproval, 0, 100);
  s.rebellion = clamp(s.rebellion + dRebellion, 0, 100);
  s.pc = clamp(s.pc + ECON.pcRegen, 0, 100);

  /* 9 — supply security outcomes
     A shortfall no longer kills you outright. A small gap is a brownout; a large
     gap forces an EMERGENCY FOREIGN POWER DEAL — interconnector imports and diesel
     bought at panic spot-prices, costing a fortune AND political capital. The lights
     stay on, but a string of these will bankrupt the Treasury (the real fail state). */
  const brownoutTol = Math.max(ECON.brownoutTolerance, f.demand * 0.12);
  if (unserved > brownoutTol) {
    const emCost = Math.round(unserved * 210);                 // £210m per unserved GW — ruinous spot prices
    const pcHit = Math.min(Math.round(s.pc), Math.round(unserved * 5));
    s.treasury -= emCost;
    s.pc = clamp(s.pc - pcHit, 0, 100);
    s.approval = clamp(s.approval - 14, 0, 100);
    s.rebellion = clamp(s.rebellion + 16, 0, 100);
    s.stats.brownouts++; s.stats.emergencyImports++;
    L("bad", `⚡ GRID EMERGENCY: ${fmtGW(unserved)} of demand unserved. Emergency interconnector imports and diesel deals struck with France, Norway and Ireland at panic prices — ${fmtM(emCost)}, −${pcHit} PC, −14 Approval, +16% Rebellion. The lights stayed on. Barely. The front pages did not forgive you.`);
  } else if (unserved > 0) {
    s.treasury -= 200; s.rebellion = clamp(s.rebellion + 6, 0, 100); s.approval = clamp(s.approval - 7, 0, 100); s.stats.brownouts++;
    L("bad", `ROLLING BROWNOUTS: ${fmtGW(unserved)} short (emergency imports kick in above ${fmtGW(brownoutTol)}). Emergency demand control invoked. −£200m, Rebellion +6%, Approval −7.`);
  }

  /* 10 — carbon levy retires gas fleet */
  if (s.policies.carbonLevy) {
    s.gasFleet = Math.max(6, r1(s.gasFleet - 1.5));
    L("info", `CARBON LEVY: 1.5 GW of CCGT retires early. Backup fleet now ${fmtGW(s.gasFleet)}.`);
  }

  s.stats.lowestTreasury = Math.min(s.stats.lowestTreasury, s.treasury);

  /* 11 — hard fails */
  if (!s.gameOver && s.treasury < 0) s.gameOver = { type: "bankrupt", detail: `The Treasury balance hit ${fmtM(s.treasury)}. The IMF answers on the second ring.` };
  if (!s.gameOver && s.rebellion >= 100) s.gameOver = { type: "coup", detail: "Letters reached the threshold. A leadership challenge was declared during your conference speech." };

  /* 12 — year-end summary with cause attribution */
  const satLines = Object.keys(s.links).filter(id => {
    const cap = s.links[id] ? s.links[id].cap : 0;
    const fl = f.byLink[id] || 0;
    return cap > 0 && fl >= cap - 0.1;
  }).map(id => LINK_DEFS[id].name);
  const curtailNote = f.curtailed > 0.05
    ? ` | ⚠ Curtailed ${fmtGW(f.curtailed)}${satLines.length ? ` (${satLines[0]} saturated)` : ""} — fine ${fmtM(fine)}`
    : "";
  const gasNote = gasFired > 0.5
    ? ` | Gas fired ${fmtGW(gasFired)}${f.curtailed > 0.05 ? " to cover southern gap from curtailment" : s.policies.carbonLevy ? " (levy applies, fleet shrinking)" : ""}`
    : " | Gas fleet idle — full clean delivery";
  L("info", `FY${prev.year} CLOSE — Demand ${fmtGW(f.demand)} | Clean ${fmtGW(f.cleanDelivered + f.batteryFirm + s.firmImports)} | Wind ${Math.round(windCF * 100)}% CF | Net Zero ${s.netZero}%${curtailNote}${gasNote}.`);

  s.lastYear = { year: prev.year, windCF, solarCF, gasFired, unserved, flows: f, income, gasCost, fine };
  s.log = [...prev.log, ...logs];
  s.whipsUsed = false;
  s.activeCrisis = null;

  if (s.gameOver) { s.phase = "dead"; return s; }
  if (prev.year >= ECON.totalYears) { s.phase = "report"; return s; }
  s.year = prev.year + 1;
  s.phase = "play";
  return s;
}

/* ------------------------------ scoring -------------------------------- */
function finalReport(s) {
  const score = Math.round(
    s.netZero * 2 + s.treasury / 40 + (100 - s.rebellion) / 2 + s.approval / 2
    + s.stats.innovations * 8 - s.stats.brownouts * 10 - s.stats.fines / 50
  );
  let title, line;
  if (s.netZero >= 90 && s.rebellion < 45) { title = "The Green Architect"; line = "Clean power, calm benches, cables in the right places. Statues will be argued about."; }
  else if (s.netZero >= 85 && (s.stats.pylons >= 2 || s.rebellion >= 60)) { title = "The Pylon Tyrant"; line = "You decarbonised Britain by sheer force of steel lattice. History forgives; the shires do not."; }
  else if (s.stats.innovations >= 4 && s.netZero >= 60) { title = "Minister for Mad Science"; line = "Kites, hamsters, fusion and a dragon. You ran the grid like a Bond villain with a select committee."; }
  else if (s.stats.corridors >= 2 && s.netZero >= 70) { title = "The Cable Layer"; line = "You redrew the map of Britain in high-voltage ink. The seabed bristles with your handiwork."; }
  else if (s.netZero >= 75) { title = "The Grid Whisperer"; line = "Not quite Net Zero, but the system hums and the lights never flickered on your watch."; }
  else if (s.stats.batteriesGW >= 8) { title = "The Battery Baron"; line = "You firmed the grid with a wall of lithium. The Dunkelflaute holds no terror for you."; }
  else if (s.treasury > 3500 && s.netZero < 60) { title = "The Treasury's Darling"; line = "A fortune unspent, a transition unstarted. The Chancellor adores you. The climate does not."; }
  else if (s.netZero < 50) { title = "The Status-Quo Bureaucrat"; line = "Twelve years of careful minutes, gentle nods, and gas on the margin. The queue endures."; }
  else { title = "The Steady Hand"; line = "Progress without panache. Britain is greener, solvent, and only mildly furious."; }
  return { score, title, line };
}

/* --------------------------- advisor brain ------------------------------ */
function advise(state, flows) {
  const nextDemand = demandForYear(Math.min(state.year + 1, 12), state.demandExtra) + state.demandExtraD;
  const firm = firmCoverGW(state);
  const marginNext = firm + flows.cleanDelivered - nextDemand;
  if (state.netZero >= 100) return { tone: "good", text: "One hundred percent. I have nothing to add, Chair, except that I never doubted you. Officially." };
  if (marginNext < 3.5) return { tone: "bad", text: `⚠ Next year's supply margin is only ~${r1(marginNext)} GW. If a wind lull hits, we'll be forced into emergency foreign power deals at ~£175m per GW short — plus a brutal hit to your Political Capital and Approval. Firm up NOW: drag a 🌙 Tidal Lagoon, ⚛️ SMR or 🔋 Battery onto the map, or buy the 🛢️ Strategic Gas Reserve.` };
  const sat = Object.keys(state.links).filter(id => state.links[id].cap > 0 && (flows.byLink[id] || 0) / state.links[id].cap >= 0.99);
  if (sat.length) {
    const d = LINK_DEFS[sat[0]];
    return { tone: "bad", text: `The ${d.name} boundary is saturated — every spare gigawatt upstream is burned as constraint fines. Drag a 🧵 HVDC cable onto that line, ✏️ draw a brand-new corridor, or drop a 🔋 Battery at ${NODE_DEFS[d.from].short}.` };
  }
  if (state.windNext < 0.8) return { tone: "warn", text: `The Met Office forecasts a still, grey year ahead (wind at ${Math.round(state.windNext * 100)}% of normal). Firm capacity now, smugness later.` };
  if (state.intermittency > 35) return { tone: "warn", text: `Intermittency risk at ${state.intermittency}%. Too much weather, not enough firmness. Batteries, nuclear — or visit the 🧪 Skunkworks and do something unhinged.` };
  if (state.rebellion > 60) return { tone: "warn", text: `Rebellion at ${Math.round(state.rebellion)}%. May I suggest the Whips' Operation, a 🫖, and fewer pylons through marginal constituencies?` };
  if (state.treasury > 2200 && state.queue.length === 0) return { tone: "warn", text: `You are sitting on ${fmtM(state.treasury)} with an empty build queue. The climate will not negotiate with a savings account, Chair.` };
  if (state.gasFleet < flows.gasNeeded + 3) return { tone: "warn", text: `The gas backup fleet (${fmtGW(state.gasFleet)}) barely covers our worst case. Firm capacity, Chair. Before winter does its annual surprise.` };
  return { tone: "info", text: "All quiet. Suspiciously quiet. Use the calm: the connections queue waits for no one." };
}

const TONE_CLASS = { info: "text-slate-300", good: "text-green-400", warn: "text-amber-400", bad: "text-red-400" };

function Stat({ label, value, sub, color }) {
  return (
    <div className="shrink-0 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800/80 border border-slate-700 min-w-[82px] sm:min-w-[104px]">

      {sub && <div className="text-[9px] sm:text-[10px] text-slate-500 whitespace-nowrap">{sub}</div>}
    </div>

}

function Header({ s, muted, onToggleMute }) {
  const rebColor = s.rebellion >= 75 ? "text-red-400 blink" : s.rebellion >= 45 ? "text-amber-400" : "text-green-400";
  const treColor = s.treasury < 400 ? "text-red-400" : s.treasury < 1200 ? "text-amber-400" : "text-green-400";
  const priColor = s.price > 14 ? "text-red-400" : s.price > 10 ? "text-amber-400" : "text-green-400";
  const history = s.netZeroHistory || [];
  const nzTrend = history.length >= 2 ? r1(history[history.length - 1] - history[history.length - 2]) : 0;
  const trendStr = nzTrend > 0.3 ? `▲ +${nzTrend}%` : nzTrend < -0.3 ? `▼ ${nzTrend}%` : "= steady";
  const trendCol = nzTrend > 0.3 ? "text-green-400" : nzTrend < -0.3 ? "text-red-400" : "text-slate-400";
  const annualIncome = ECON.baseIncome + (s.year - 1) * 30 + (s.policies.carbonLevy ? 300 : 0)
    + (s.policies.heatPumpMandate ? 150 : 0) - (s.scotTariff ? 200 : 0) + (s.baseIncomeBonus || 0);
  return (
    <header className="shrink-0 bg-[#1e293b] border-b border-slate-700 px-2 sm:px-4 py-1.5 sm:py-2 flex items-center gap-2 sm:gap-3">
      <div className="shrink-0">
        <div className="text-green-400 font-term font-bold text-base sm:text-lg leading-none">GRIDLOCK</div>
        <div className="hidden sm:block text-[10px] text-slate-400 tracking-widest">THE GREAT BRITISH UPGRADE</div>
      </div>
      <div className="flex items-center gap-2 sm:gap-3 overflow-x-auto flex-1 min-w-0 py-0.5">
        <Stat label="Year" value={`${s.year} / ${ECON.totalYears}`} sub={`FY ${2025 + s.year}`} color="text-slate-100" />
        <Stat label="Treasury" value={fmtM(s.treasury)} sub={`${annualIncome >= 0 ? "+" : ""}${fmtM(annualIncome)}/yr`} color={treColor} />
        <Stat label="Pol. Capital" value={`${Math.round(s.pc)} PC`} sub={`+${ECON.pcRegen}/yr`} color={s.pc < 20 ? "text-amber-400" : "text-green-400"} />
        <Stat label="Price" value={fmtP(s.price)} sub="per kWh" color={priColor} />
        <Stat label="Rebellion" value={`${Math.round(s.rebellion)}%`} sub="coup at 100%" color={rebColor} />
        <Stat label="Net Zero" value={`${r1(s.netZero)}%`} sub={<span className={trendCol}>{trendStr}</span>} color="text-green-400" />
      </div>
      <button onClick={onToggleMute} title={muted ? "Unmute" : "Mute"}
        className="shrink-0 px-2 sm:px-2.5 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-lg leading-none">
        {muted ? "🔇" : "🔊"}
      </button>
    </header>
  );
}

  "M186 12 L198 10 L204 18 L196 24 L186 20 Z",                          // Orkney
  "M208 26 L216 24 L218 31 L210 33 Z",                                  // more Orkney
  "M56 314 L68 312 L72 320 L62 324 Z",                                  // Anglesey
  "M152 474 L166 472 L170 479 L156 482 Z",                              // Isle of Wight
];

const LINK_LABEL_OFF = { L1: { dx: -2, dy: -6 }, L2: { dx: 20, dy: 22 }, L3: { dx: -60, dy: 4 }, L4: { dx: -30, dy: -14 }, X1: { dx: 6, dy: 0 }, X2: { dx: 6, dy: -28 }, X3: { dx: -28, dy: -16 }, X4: { dx: -56, dy: 6 } };

function linkPathD(def) {
  const from = NODE_DEFS[def.from], to = NODE_DEFS[def.to];
  return def.ctrl
    ? `M ${from.x} ${from.y} Q ${def.ctrl.x} ${def.ctrl.y} ${to.x} ${to.y}`
    : `M ${from.x} ${from.y} L ${to.x} ${to.y}`;
}
function linkMid(def) {
  const from = NODE_DEFS[def.from], to = NODE_DEFS[def.to];
  if (def.ctrl) return { x: 0.25 * from.x + 0.5 * def.ctrl.x + 0.25 * to.x, y: 0.25 * from.y + 0.5 * def.ctrl.y + 0.25 * to.y };
  return { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
}

function LinkLine({ link, flows, state, selected, onSelect, dragUI }) {
  const def = LINK_DEFS[link];
  const cap = state.links[link].cap;
  const flow = flows.byLink[link] || 0;
  const util = cap > 0 ? flow / cap : 1;
  const atCap = util >= 0.99;
  const stroke = atCap ? "#ef4444" : util > 0.75 ? "#fbbf24" : "#4ade80";
  const d = linkPathD(def);
  const mid = linkMid(def);
  const off = LINK_LABEL_OFF[link] || { dx: 0, dy: 0 };
  const isSel = selected && selected.type === "link" && selected.id === link;
  const dragLink = dragUI && dragUI.item.cat === "link";
  const isDropTarget = dragLink && dragUI.target && dragUI.target.type === "link" && dragUI.target.id === link;
  return (
    <g className="cursor-pointer" onClick={(e) => { e.stopPropagation(); onSelect({ type: "link", id: link }); }}>
      <path d={d} fill="none" stroke="transparent" strokeWidth="18" />
      {isSel && <path d={d} fill="none" stroke="#38bdf8" strokeWidth="9" strokeOpacity="0.35" />}
      {dragLink && <path d={d} fill="none" stroke="#22d3ee" strokeWidth={isDropTarget ? 12 : 7} strokeOpacity={isDropTarget ? 0.55 : 0.25} className={isDropTarget ? "" : "blink"} />}
      <path d={d} fill="none" stroke={stroke} strokeWidth={3 + Math.min(cap, 14) * 0.35}
            strokeLinecap="round" className={atCap ? "pulse-danger" : ""} strokeDasharray={def.subsea ? "7 4" : "none"} />
      {flow > 0.05 && !atCap && (
        <path d={d} fill="none" stroke="#ecfdf5" strokeOpacity="0.7"
              strokeWidth="1.6" strokeLinecap="round" strokeDasharray="3 9" className="flow-anim" />
      )}
      <g transform={`translate(${mid.x + off.dx}, ${mid.y + off.dy})`}>
        <rect x="-4" y="-11" width="62" height={atCap ? 30 : 18} rx="4" fill="#0f172a" stroke={stroke} strokeWidth="0.8" opacity="0.92" />
        <text x="27" y="2" textAnchor="middle" fontSize="9" className="font-term" fill={stroke} fontWeight="bold">
          {r1(flow)}/{r1(cap)} GW
        </text>
        {atCap && <text x="27" y="14" textAnchor="middle" fontSize="8" fill="#ef4444" fontWeight="bold" className="blink">⚠ BOTTLENECK</text>}
      </g>
    </g>
  );
}

/* corridors under construction — drawn but not yet energised */
function PendingCorridor({ q }) {
  const def = LINK_DEFS[q.linkId];
  const mid = linkMid(def);
  return (
    <g pointerEvents="none">
      <path d={linkPathD(def)} fill="none" stroke="#94a3b8" strokeWidth="3" strokeDasharray="3 6" opacity="0.6" />
      <g transform={`translate(${mid.x - 24}, ${mid.y - 6})`}>
        <rect x="-3" y="-10" width="56" height="15" rx="4" fill="#0f172a" stroke="#f59e0b" strokeWidth="0.8" opacity="0.92" />
        <text x="25" y="1.5" textAnchor="middle" fontSize="8" fill="#f59e0b" className="font-term">🏗 {q.turnsLeft} yr</text>
      </g>
    </g>
  );
}

/* faint candidate routes shown while the pencil is out */
function GhostRoutes({ state }) {
  return (
    <g pointerEvents="none">
      {["X1", "X2", "X3", "X4"].map(id => {
        if (state.links[id] || state.linkQueue.some(q => q.linkId === id)) return null;
        const def = LINK_DEFS[id];
        const pair = [def.from, def.to].sort().join("");
        const rec = CORRIDORS[pair];
        const mid = linkMid(def);
        return (
          <g key={id}>
            <path d={linkPathD(def)} fill="none" stroke="#22d3ee" strokeWidth="1.6" strokeDasharray="2 5" opacity="0.55" />
            <text x={mid.x + 8} y={mid.y} fontSize="7" fill="#22d3ee" opacity="0.85" className="font-term">{fmtM(rec.cost)} · {rec.gw} GW</text>
          </g>
        );
      })}
    </g>
  );
}

/* SimCity layer: every installed asset is a real icon on the map.
   Land kit spirals out around the node; offshore kit marches out to sea. */
const SEAWARD = { A: { x: 36, y: -10, sx: 11, sy: -8 }, C: { x: 32, y: 14, sx: 10, sy: 9 }, B: { x: -40, y: -16, sx: -11, sy: -7 }, D: { x: 30, y: 26, sx: 11, sy: 7 }, E: { x: -34, y: 18, sx: -10, sy: 8 } };
function landSlot(i) {
  const GA = 2.39996; // golden angle keeps the sprawl organic
  const r = 27 + 5.6 * Math.sqrt(i + 0.5);
  const a = i * GA + 0.9;
  return { dx: Math.cos(a) * r, dy: Math.sin(a) * r * 0.8 };
}
function NodeCity({ state, id }) {
  const def = NODE_DEFS[id];
  const sea = SEAWARD[id];
  const items = [];
  for (const a of state.assets) if (a.nodeId === id) items.push({ icon: a.icon, name: a.name, gw: a.gw, sea: a.type === "offshore", ghost: false });
  for (const q of state.queue) if (q.nodeId === id) items.push({ icon: ASSET_TYPES[q.type].icon, name: q.label, gw: q.gw, sea: q.type === "offshore", ghost: true, eta: q.turnsLeft });
  const seaItems = items.filter(it => it.sea), landItems = items.filter(it => !it.sea);
  const MAX = 14;
  const shown = [];
  landItems.slice(0, MAX).forEach((it, i) => { const s = landSlot(i); shown.push({ ...it, x: def.x + s.dx, y: def.y + s.dy }); });
  seaItems.slice(0, 6).forEach((it, i) => { shown.push({ ...it, x: def.x + sea.x + sea.sx * i, y: def.y + sea.y + sea.sy * i }); });
  const hidden = items.length - shown.length;
  return (
    <g pointerEvents="none">
      {shown.map((it, i) => (
        <g key={i} transform={`translate(${it.x}, ${it.y})`} opacity={it.ghost ? 0.5 : 1}>
          <circle r="7" fill="#0f172a" opacity="0.8" />
          <text textAnchor="middle" y="3.2" fontSize={it.gw >= 2.5 ? 11 : 9}>{it.icon}</text>
          {it.ghost && (
            <g transform="translate(5,-5)">
              <circle r="4.4" fill="#f59e0b" />
              <text textAnchor="middle" y="2.4" fontSize="6.5" fill="#1e293b" fontWeight="bold">{it.eta}</text>
            </g>
          )}
          <title>{it.name} — {fmtGW(it.gw)}{it.ghost ? ` (connects in ${it.eta} yr)` : ""}</title>
        </g>
      ))}
      {hidden > 0 && (
        <text x={def.x + 30} y={def.y + 30} fontSize="7.5" fill="#94a3b8" className="font-term">+{hidden} more</text>
      )}
    </g>
  );
}

function NodeCircle({ id, state, flows, selected, onSelect, dragUI, drawMode }) {
  const def = NODE_DEFS[id];
  const g = flows.g[id];
  const dem = flows.dem[id];
  const surplus = g.gen - dem;
  const isSel = selected && selected.type === "node" && selected.id === id;
  const fill = surplus > 0.2 ? "#14532d" : "#7f1d1d";
  const ring = surplus > 0.2 ? "#4ade80" : "#f87171";
  const dragAsset = dragUI && (dragUI.item.cat === "asset" || dragUI.item.cat === "draw");
  const validTarget = (dragAsset && !(dragUI.item.id === "offshore" && !def.offshoreOk))
    || (drawMode && drawMode.from !== id);
  const isDropTarget = (dragAsset && dragUI.target && dragUI.target.type === "node" && dragUI.target.id === id);
  const isAnchor = drawMode && drawMode.from === id;
  return (
    <g className="cursor-pointer" onClick={(e) => { e.stopPropagation(); onSelect({ type: "node", id }); }}>
      {/* demand footprint */}
      <circle cx={def.x} cy={def.y} r={8 + dem * 0.55} fill="none" stroke="#64748b" strokeWidth="0.8" strokeDasharray="2 3" opacity="0.55" />
      {isSel && <circle cx={def.x} cy={def.y} r="26" fill="none" stroke="#38bdf8" strokeWidth="2.5" strokeDasharray="4 3" />}
      {validTarget && <circle cx={def.x} cy={def.y} r="26" fill={isDropTarget ? "#164e63" : "none"} fillOpacity="0.6" stroke="#22d3ee" strokeWidth={isDropTarget ? 3 : 1.5} strokeDasharray="5 3" className="drop-ring" />}
      {isAnchor && <circle cx={def.x} cy={def.y} r="25" fill="none" stroke="#22d3ee" strokeWidth="3" />}
      <circle cx={def.x} cy={def.y} r="19" fill={fill} stroke={ring} strokeWidth="2.5" className={surplus > 0.2 ? "node-glow" : ""} />
      <text x={def.x} y={def.y + 1} textAnchor="middle" fontSize="13" fill="#f1f5f9" fontWeight="bold" className="font-term">{id}</text>
      <text x={def.x} y={def.y + 11} textAnchor="middle" fontSize="6.5" fill={ring} className="font-term">{surplus >= 0 ? "+" : ""}{r1(surplus)}</text>
      <text x={def.x + (def.labelDX || 0)} y={def.y + (def.labelBelow ? 34 : -26)} textAnchor="middle" fontSize="8.5" fill="#cbd5e1" fontWeight="bold" letterSpacing="1">{def.short}</text>
    </g>
  );
}

function paletteDef(item) {
  if (item.cat === "asset") return ASSET_TYPES[item.id];
  if (item.cat === "link") return LINK_UPGRADES[item.id];
  return DRAW_TOOL;
}
function PaletteChip({ item, state, onStartDrag }) {
  const def = paletteDef(item);
  const isDraw = item.cat === "draw";
  const cost = isDraw ? 0 : Math.round(def.cost * (item.id === "battery" ? state.batteryDiscount : 1) * (item.cat === "asset" ? (state.costMult || 1) : 1));
  const afford = isDraw || state.treasury >= cost;
  const shortName = item.cat === "asset" ? def.name.split(" ")[0] : item.id === "pylon" ? "Pylons" : item.id === "hvdc" ? "HVDC" : "Draw Line";
  return (
    <div
      onPointerDown={e => onStartDrag(item, e)}
      className={`chip-grab shrink-0 px-2 py-1 rounded-lg border text-center transition select-none
        ${isDraw ? "border-cyan-600 bg-cyan-950/40 hover:border-cyan-300" : afford ? "border-slate-600 bg-slate-800 hover:border-cyan-400 hover:bg-slate-700" : "border-slate-700 bg-slate-800/40 opacity-45"}`}
      title={def.desc}
    >
      <div className="text-base leading-none">{def.icon}</div>
      <div className="text-[9px] font-bold text-slate-200 leading-tight whitespace-nowrap">{shortName}</div>
      <div className={`font-term text-[9px] ${isDraw ? "text-cyan-300" : afford ? "text-green-400" : "text-red-400"}`}>{isDraw ? "new route" : fmtM(cost)}</div>
    </div>
  );
}

const HOME_VIEW = { x: 0, y: 0, w: 320, h: 560 };

function MapPanel({ state, flows, selected, onSelect, svgRef, dragUI, onStartDrag, drawMode, rubberRef }) {
  const drawing = drawMode || (dragUI && dragUI.item.cat === "draw");
  const anchor = drawMode ? NODE_DEFS[drawMode.from] : null;

  /* ---- zoom & pan ---- */
  const [view, setView] = useState(HOME_VIEW);
  const viewRef = useRef(view);
  useEffect(() => { viewRef.current = view; }, [view]);
  const panMovedRef = useRef(false);
  const pointersRef = useRef(new Map());   // pointerId -> {x,y}
  const gestureRef = useRef(null);          // {type:'pan',sx,sy,ox,oy} | {type:'pinch',lastDist}
  const moveRef = useRef(null);
  const upRef = useRef(null);

  const clampView = v => {
    const w = clamp(v.w, 80, 320), h = w * 1.75;
    return { w, h, x: clamp(v.x, -40, 360 - w), y: clamp(v.y, -40, 600 - h) };
  };
  const zoomAt = (clientX, clientY, factor) => {
    const svg = svgRef.current; if (!svg) return;
    try {
      const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
      const m = svg.getScreenCTM(); if (!m) return;
      const p = pt.matrixTransform(m.inverse());
      setView(v => {
        const w = clamp(v.w * factor, 80, 320);
        const scale = w / v.w;
        return clampView({ w, h: w * 1.75, x: p.x - (p.x - v.x) * scale, y: p.y - (p.y - v.y) * scale });
      });
    } catch (e) { /* ignore */ }
  };
  const zoomCentre = factor => {
    const svg = svgRef.current; if (!svg) return;
    const r = svg.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
  };
  useEffect(() => {
    const svg = svgRef.current; if (!svg) return;
    const onWheel = e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.18 : 1 / 1.18); };
    svg.addEventListener("wheel", onWheel, { passive: false });
    return () => svg.removeEventListener("wheel", onWheel);
  }, []);
  /* unified pointer gesture: one finger/mouse pans, two fingers pinch-zoom */
  moveRef.current = e => {
    const ptrs = pointersRef.current;
    if (!ptrs.has(e.pointerId)) return;           // not a map gesture
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const list = [...ptrs.values()];
    if (list.length >= 2) {
      const [a, b] = list;
      const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const g = gestureRef.current;
      if (g && g.type === "pinch" && g.lastDist) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, g.lastDist / dist);
      gestureRef.current = { type: "pinch", lastDist: dist };
      panMovedRef.current = true;
    } else {
      let g = gestureRef.current;
      if (!g || g.type !== "pan") { gestureRef.current = { type: "pan", sx: e.clientX, sy: e.clientY, ox: viewRef.current.x, oy: viewRef.current.y }; return; }
      const svg = svgRef.current; if (!svg) return;
      const r = svg.getBoundingClientRect();
      const scale = Math.max(viewRef.current.w / r.width, viewRef.current.h / r.height);
      if (Math.abs(e.clientX - g.sx) + Math.abs(e.clientY - g.sy) > 6) panMovedRef.current = true;
      setView(v => clampView({ ...v, x: g.ox - (e.clientX - g.sx) * scale, y: g.oy - (e.clientY - g.sy) * scale }));
    }
  };
  upRef.current = e => {
    const ptrs = pointersRef.current;
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    gestureRef.current = ptrs.size === 0 ? null : { type: "reset" };  // re-anchor on next move
  };
  useEffect(() => {
    const mv = e => moveRef.current && moveRef.current(e);
    const up = e => upRef.current && upRef.current(e);
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    return () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); };
  }, []);
  const startPan = e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.stopPropagation();
    pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    gestureRef.current = pointersRef.current.size >= 2
      ? { type: "pinch", lastDist: 0 }
      : { type: "pan", sx: e.clientX, sy: e.clientY, ox: viewRef.current.x, oy: viewRef.current.y };
  };
  const onBgClick = () => {
    if (panMovedRef.current) { panMovedRef.current = false; return; }
    onSelect(null);
  };

  return (
    <div className="h-full flex flex-col bg-[#1e293b] rounded-xl border border-slate-700 overflow-hidden">
      <div className="px-3 py-2 border-b border-slate-700 flex items-center justify-between">
        <div className="text-xs font-bold tracking-widest text-slate-300">NATIONAL TRANSMISSION MAP</div>
        {drawMode
          ? <div className="text-[10px] text-cyan-300 font-term blink">✏️ click destination region — click sea to cancel</div>
          : <div className="text-[10px] text-slate-500 font-term">pinch / scroll to zoom · drag sea to pan</div>}
      </div>
      <div className="flex-1 min-h-0 relative" onClick={onBgClick}>
        <svg ref={svgRef} viewBox={`${view.x} ${view.y} ${view.w} ${view.h}`} className="map-svg w-full h-full" preserveAspectRatio="xMidYMid meet" style={{ cursor: "grab" }}>
          <defs>
            <pattern id="gridpat" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" strokeWidth="0.4" />
            </pattern>
          </defs>
          <rect x="-200" y="-200" width="760" height="1000" fill="url(#gridpat)" opacity="0.5" onPointerDown={startPan} />
          <path d={GB_PATH} fill="#273548" stroke="#475569" strokeWidth="1.5" onPointerDown={startPan} />
          {ISLAND_PATHS.map((d, i) => <path key={i} d={d} fill="#223044" stroke="#3e4f66" strokeWidth="1" onPointerDown={startPan} />)}
          <g pointerEvents="none" fill="#475569" fontStyle="italic" letterSpacing="3">
            <text x="248" y="160" fontSize="9">NORTH</text>
            <text x="252" y="172" fontSize="9">SEA</text>
            <text x="28" y="350" fontSize="9">IRISH</text>
            <text x="32" y="362" fontSize="9">SEA</text>
            <text x="104" y="528" fontSize="9">ENGLISH CHANNEL</text>
          </g>
          {drawing && <GhostRoutes state={state} />}
          {["L1", "L3", "L2", "L4", "X1", "X2", "X3", "X4"].filter(id => state.links[id]).map(id => (
            <LinkLine key={id} link={id} flows={flows} state={state} selected={selected} onSelect={onSelect} dragUI={dragUI} />
          ))}
          {state.linkQueue.filter(q => q.newLink && !state.links[q.linkId]).map(q => <PendingCorridor key={q.uid} q={q} />)}
          {anchor && <line ref={rubberRef} x1={anchor.x} y1={anchor.y} x2={anchor.x} y2={anchor.y} stroke="#22d3ee" strokeWidth="2.5" strokeDasharray="6 4" pointerEvents="none" />}
          {["A", "B", "C", "D", "E"].map(id => (
            <NodeCircle key={id} id={id} state={state} flows={flows} selected={selected} onSelect={onSelect} dragUI={dragUI} drawMode={drawMode} />
          ))}
          {["A", "B", "C", "D", "E"].map(id => <NodeCity key={id} state={state} id={id} />)}
        </svg>
        <div className="absolute top-2 right-2 flex flex-col gap-1.5" onClick={e => e.stopPropagation()}>
          <button onClick={() => zoomCentre(1 / 1.4)} title="Zoom in" className="w-9 h-9 sm:w-7 sm:h-7 rounded-md bg-slate-800/90 border border-slate-600 hover:bg-slate-700 active:bg-slate-600 text-slate-200 text-lg sm:text-base font-bold leading-none">+</button>
          <button onClick={() => zoomCentre(1.4)} title="Zoom out" className="w-9 h-9 sm:w-7 sm:h-7 rounded-md bg-slate-800/90 border border-slate-600 hover:bg-slate-700 active:bg-slate-600 text-slate-200 text-lg sm:text-base font-bold leading-none">−</button>
          <button onClick={() => setView(HOME_VIEW)} title="Reset view" className="w-9 h-9 sm:w-7 sm:h-7 rounded-md bg-slate-800/90 border border-slate-600 hover:bg-slate-700 active:bg-slate-600 text-slate-200 text-sm leading-none">⌂</button>
        </div>
      </div>
      <div className="px-2 py-1.5 border-t border-slate-700 shrink-0">
        <div className="flex items-center gap-1.5 overflow-x-auto">
          <div className="shrink-0 text-[9px] font-bold tracking-widest text-cyan-400 leading-tight w-14">BUILD<br/>PALETTE<br/><span className="text-slate-500 font-normal">drag → map</span></div>
          {PALETTE.map(p => <PaletteChip key={p.id} item={p} state={state} onStartDrag={onStartDrag} />)}
        </div>
        <div className="text-[9px] text-slate-500 font-term px-1 pt-1">dotted ring = demand footprint · icons = your kit (hover them) · 🏗️ = under construction</div>
      </div>
    </div>
  );
}

/* --------------------------- right panel tabs ---------------------------- */
function Bar({ value, max, color }) {
  return (
    <div className="h-2 bg-slate-700 rounded-full overflow-hidden">
      <div className={`h-full ${color} transition-all duration-500`} style={{ width: `${clamp((value / max) * 100, 0, 100)}%` }} />
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div className="bg-slate-800/60 border border-slate-700 rounded-lg p-3">
      <div className="text-[10px] font-bold tracking-widest text-slate-400 mb-2">{title}</div>
      {children}
    </div>
  );
}

function Row({ k, v, tone }) {
  const c = tone === "bad" ? "text-red-400" : tone === "warn" ? "text-amber-400" : "text-slate-100";
  return (
    <div className="flex justify-between text-[12px] py-0.5">
      <span className="text-slate-400">{k}</span>
      <span className={`font-term font-bold ${c}`}>{v}</span>
    </div>
  );
}

function PolicyBtn({ done, title, desc, enabled, onClick, doneLabel }) {
  if (done) return (
    <div className="w-full px-3 py-2 rounded-lg border border-green-700 bg-green-900/30 mb-2">
      <div className="text-sm font-bold text-green-400">✓ {doneLabel}</div>
    </div>
  );
  return (
    <button onClick={onClick} disabled={!enabled}
      className="w-full text-left px-3 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition mb-2">
      <div className="text-sm font-bold text-slate-100">📜 {title}</div>
      <div className="text-[11px] text-slate-400">{desc}</div>
      {!enabled && <div className="text-[10px] text-red-400 mt-0.5">Insufficient Political Capital</div>}
    </button>
  );
}

function DefaultTab({ state, flows, dispatch }) {
  const [showMech, setShowMech] = useState(false);
  const margin = firmCoverGW(state) + flows.cleanDelivered - flows.demand;
  const nextDemand = demandForYear(Math.min(state.year + 1, 12), state.demandExtra) + state.demandExtraD;
  return (
    <div className="space-y-3">
      <Section title="NATIONAL DASHBOARD">
        <Row k="Demand this year" v={fmtGW(flows.demand)} />
        <Row k="Demand next year" v={fmtGW(nextDemand)} tone="warn" />
        <Row k="Demand by Year 12" v={fmtGW(demandForYear(12, state.demandExtra) + state.demandExtraD)} tone="warn" />
        <Row k="Gas backup fleet" v={fmtGW(state.gasFleet)} tone={state.gasFleet < flows.gasNeeded ? "bad" : null} />
        <Row k="Firm imports" v={fmtGW(state.firmImports)} />
        {state.scotTariff && <Row k="Scottish transmission tariff" v="−£200m/yr" tone="bad" />}
        {state.loan && <Row k="Grid Bond repayment" v={`−${fmtM(state.loan.perYear)}/yr (${state.loan.yearsLeft} yr)`} tone="warn" />}
        <Row k="Public approval" v={`${Math.round(state.approval)}%`} tone={state.approval < 35 ? "bad" : null} />
        <Row k="🌬 Met Office wind outlook (next yr)" v={`${Math.round(state.windNext * 100)}% of normal`} tone={state.windNext < 0.83 ? "warn" : null} />
        <div className="mt-2">
          <div className="flex justify-between text-[10px] text-slate-400 mb-1">
            <span>GRID INTERMITTENCY RISK</span>
            <span className={state.intermittency > 40 ? "text-red-400 font-bold" : state.intermittency > 20 ? "text-amber-400" : "text-green-400"}>{state.intermittency}% {state.intermittency > 40 ? "⚠ UNSTABLE" : state.intermittency > 20 ? "ELEVATED" : "STABLE"}</span>
          </div>
          <Bar value={state.intermittency} max={60} color={state.intermittency > 40 ? "bg-red-500" : state.intermittency > 25 ? "bg-amber-400" : "bg-green-500"} />
          <div className="mt-1.5 space-y-1">
            {(() => {
              const t = totalsByKind(state);
              const variableGW = r1(t.wind + t.solar);
              const firmGW = r1(t.nuclear + t.tidal * 0.92 + t.battery * ECON.batteryFirmFactor + state.firmImports);
              // per-node: wind+solar capacity minus nuclear, tidal and battery firm
              const nodeScore = {};
              for (const id of ["A","B","C","D","E"]) {
                const g = flows.g[id];
                nodeScore[id] = g.windCap + g.solarCap - g.nuclear - (g.tidal || 0) * 0.92 - g.battery * ECON.batteryFirmFactor;
              }
              const bestNode = Object.entries(nodeScore).sort((a,b) => b[1]-a[1])[0];
              const satLink = Object.keys(state.links).find(id => {
                const cap = state.links[id] ? state.links[id].cap : 0;
                return cap > 0 && (flows.byLink[id] || 0) / cap >= 0.99;
              });
              return (
                <>
                  <div className="text-[10px] text-slate-500">
                    Variable (wind+solar): <span className="text-amber-400 font-term">{variableGW} GW</span> | Firm (nuclear+tidal+batteries×50%+imports): <span className="text-green-400 font-term">{firmGW} GW</span>
                  </div>
                  <div className="text-[10px] text-slate-500 italic">Intermittency rises when variable far exceeds firm. A Dunkelflaute (wind lull) can leave a variable-heavy grid dangerously short — forcing costly emergency imports.</div>
                  {state.intermittency > 15 && bestNode && bestNode[1] > 0.5 && (
                    <div className="text-[10px] text-amber-300 bg-amber-950/30 border border-amber-800/50 rounded px-2 py-1">
                      ⚡ Best fix: add a 🔋 Battery at <b>{NODE_DEFS[bestNode[0]].short}</b> — it has {fmtGW(r1(bestNode[1]))} more variable than firm generation. Each 2 GW battery firms up 1 GW of that gap.
                    </div>
                  )}
                  {satLink && (
                    <div className="text-[10px] text-red-300 bg-red-950/30 border border-red-800/50 rounded px-2 py-1">
                      🔌 A battery at {NODE_DEFS[LINK_DEFS[satLink].from].short} also reduces curtailment on the saturated {LINK_DEFS[satLink].name} line.
                    </div>
                  )}
                  {t.nuclear + t.tidal < 3 && (
                    <div className="text-[10px] text-purple-300 bg-purple-950/30 border border-purple-800/50 rounded px-2 py-1">
                      ⚛️ Low firm baseload ({fmtGW(r1(t.nuclear + t.tidal))} nuclear+tidal). An ⚛️ SMR anywhere — or a 🌙 Tidal Lagoon at S. Wales — gives firm 24/7 power, the strongest cut to intermittency.
                    </div>
                  )}
                  {state.intermittency <= 15 && <div className="text-[10px] text-green-400">✓ Firm cover looks healthy. Keep building if demand is still rising.</div>}
                </>
              );
            })()}
          </div>
        </div>
        <div className="mt-2">
          <div className="flex justify-between text-[10px] text-slate-400 mb-1">
            <span>SUPPLY MARGIN (clean + firm − demand)</span>
            <span className={margin < 3 ? "text-red-400 font-bold" : "text-green-400"}>{margin >= 0 ? "+" : ""}{r1(margin)} GW</span>
          </div>
          <Bar value={Math.max(margin, 0)} max={20} color={margin < 3 ? "bg-red-500" : margin < 8 ? "bg-amber-400" : "bg-green-500"} />
          {margin < 5 && (
            <div className="text-[10px] text-red-300 bg-red-950/40 border border-red-800 rounded px-2 py-1 mt-1.5">
              🕯 <b>BLACKOUT RISK.</b> If a wind lull or cold snap pushes the shortfall past ~{fmtGW(Math.max(ECON.brownoutTolerance, flows.demand * 0.12))}, you'll be forced into emergency foreign power deals at <b>£175m per GW</b> short — and lose Political Capital and Approval. Add firm capacity or imports before next year.
            </div>
          )}
        </div>
      </Section>

      <Section title="GLOBAL POLICY LEVERS">
        {state.year < 7 && (
          <div className="text-[10px] text-cyan-600 font-term mb-2 px-1">♨️ 📊 Late-game policies unlock at Year 7</div>
        )}
        {POLICIES.filter(P => !P.minYear || state.year >= P.minYear).map(P => (
          <PolicyBtn
            key={P.id}
            done={state.policies[P.id]}
            title={`${P.icon} ${P.name}${P.cost ? ` — ${fmtM(P.cost)}` : ""}`}
            desc={P.desc}
            enabled={state.pc >= P.pc && state.treasury >= P.cost}
            onClick={() => dispatch({ type: "policy", id: P.id })}
            doneLabel={P.doneLabel}
          />
        ))}
        <button
          disabled={state.whipsUsed || state.pc < 15}
          onClick={() => dispatch({ type: "whips" })}
          className="w-full text-left px-3 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
        >
          <div className="text-sm font-bold text-slate-100">🥃 Whips' Operation <span className="text-slate-400 font-normal">(once per year)</span></div>
          <div className="text-[11px] text-slate-400">Spend 15 PC → Rebellion Risk −15%. {state.whipsUsed ? "Already deployed this year." : ""}</div>
        </button>
      </Section>

      <Section title="TREASURY & FINANCE">
        {(() => {
          const yearsLeft = Math.max(1, ECON.totalYears - state.year + 1);
          const PRINCIPAL = 1800, INTEREST = 1.25;
          const perYear = Math.ceil((PRINCIPAL * INTEREST) / yearsLeft);
          if (state.loan) {
            return (
              <div className="px-3 py-2 rounded-lg border border-sky-800 bg-sky-950/30">
                <div className="text-sm font-bold text-sky-300">💷 National Grid Bond active</div>
                <div className="text-[11px] text-slate-400">Repaying {fmtM(state.loan.perYear)}/yr for {state.loan.yearsLeft} more year{state.loan.yearsLeft > 1 ? "s" : ""}.</div>
              </div>
            );
          }
          if (state.loanUsed) {
            return <div className="text-[11px] text-slate-500 italic">National Grid Bond already issued this term. One per government.</div>;
          }
          return (
            <button onClick={() => dispatch({ type: "borrow" })}
              className="w-full text-left px-3 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 transition">
              <div className="text-sm font-bold text-slate-100">💷 Issue a National Grid Bond — borrow {fmtM(PRINCIPAL)}</div>
              <div className="text-[11px] text-slate-400">Get {fmtM(PRINCIPAL)} now to spend on the build-out. Repay {fmtM(perYear)}/yr over the remaining {yearsLeft} year{yearsLeft > 1 ? "s" : ""} ({fmtM(Math.round(PRINCIPAL * INTEREST))} total, 25% interest). One-time only.</div>
            </button>
          );
        })()}
      </Section>

      <Section title={`CONNECTIONS QUEUE (${state.queue.length + state.linkQueue.length})`}>
        {state.queue.length + state.linkQueue.length === 0 && <div className="text-[11px] text-slate-500 italic">Queue empty. Suspiciously tidy.</div>}
        {state.queue.map(q => (
          <div key={q.uid} className="flex justify-between items-center text-[11px] py-0.5">
            <span className="text-slate-300">{ASSET_TYPES[q.type].icon} {q.label} → {NODE_DEFS[q.nodeId].short}</span>
            <span className="font-term text-amber-400">{q.turnsLeft} yr</span>
          </div>
        ))}
        {state.linkQueue.map(q => (
          <div key={q.uid} className="flex justify-between items-center text-[11px] py-0.5">
            <span className="text-slate-300">⚡ {q.label} → {LINK_DEFS[q.linkId].name}</span>
            <span className="font-term text-amber-400">{q.turnsLeft} yr</span>
          </div>
        ))}
      </Section>

      <Section title="MECHANICS (FULL TRANSPARENCY)">
        <button onClick={() => setShowMech(v => !v)} className="text-[11px] text-sky-400 hover:text-sky-300">{showMech ? "▾ hide the maths" : "▸ show the maths"}</button>
        {showMech && (
          <div className="text-[10.5px] text-slate-400 font-term space-y-1 mt-1 leading-relaxed">
            <div>price = 3.5 + 0.19·gasGW + 0.12·curtailGW (+1.2 levy)</div>
            <div>curtail fine = £40m × excess GW over boundary cap</div>
            <div>battery: absorbs 0.5·GW of spill locally + 0.5·GW firm cover</div>
            <div>tidal: firm clean power at ~92% capacity factor (Severn-class)</div>
            <div>intermittency = (wind+solar − {state.firmMult}·(nuclear+tidal+battery+imports)) / demand</div>
            <div>net zero = 1 − gasFired/demand</div>
            <div>shortfall &gt; max(4, 12%·demand) ⇒ EMERGENCY IMPORTS: −£175m/GW, −5 PC/GW, −14 Approval, +16% Rebellion (no longer instant game-over)</div>
            <div>smaller shortfall ⇒ brownout: −£200m, −7 Approval, +6% Rebellion</div>
            <div>income £585m/yr +£30m/yr (+£300m levy) · gas fuel £9m per GW fired</div>
            <div>pylon: +3 GW/1yr/£320m/+4% rebellion · HVDC: +5 GW/2yr/£700m/painless</div>
            <div>wind capacity factor drawn 75–105% yearly (5% in a Dunkelflaute; strato-kites immune)</div>
          </div>
        )}
      </Section>
    </div>
  );
}

function LabTab({ state, dispatch }) {
  return (
    <div className="space-y-2">
      <div className="text-[11px] text-slate-400 italic px-1">
        The basement department nobody audits. One shot each. Odds printed on the tin. Make Britain weird again.
      </div>
      {INNOVATIONS.map(def => {
        const st = state.innovations[def.id];
        const afford = state.treasury >= def.cost && state.pc >= def.pc;
        return (
          <div key={def.id} className={`rounded-lg border p-2.5 ${st.status === "done" ? "border-green-700 bg-green-900/20" : st.status === "failed" ? "border-red-800 bg-red-950/20" : "border-slate-600 bg-slate-800"}`}>
            <div className="flex justify-between items-baseline gap-2">
              <span className="text-[12.5px] font-bold text-slate-100">{def.icon} {def.name}</span>
              <span className="font-term text-[11px] shrink-0 text-slate-300">{fmtM(def.cost)}{def.pc ? ` + ${def.pc} PC` : ""}</span>
            </div>
            <div className="text-[10.5px] text-slate-400 mt-0.5">{def.desc}</div>
            <div className="flex items-center justify-between mt-1.5">
              <span className="font-term text-[10px] text-slate-500">
                {def.years === 0 ? "instant" : `${def.years} yr build`} · {Math.round(def.odds * 100)}% success
              </span>
              {st.status === "idle" && (
                <button disabled={!afford} onClick={() => dispatch({ type: "innovate", id: def.id })}
                  className="px-3 py-1 rounded-md bg-cyan-600 hover:bg-cyan-500 disabled:bg-slate-700 disabled:text-slate-500 text-slate-950 text-[11px] font-bold transition">
                  🚀 LAUNCH
                </button>
              )}
              {st.status === "building" && <span className="font-term text-[11px] text-amber-400 blink">🏗️ {st.turnsLeft} yr remaining</span>}
              {st.status === "done" && <span className="font-term text-[11px] text-green-400">✓ DEPLOYED</span>}
              {st.status === "failed" && <span className="font-term text-[11px] text-red-400">✗ GLORIOUS FAILURE</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function NodeTab({ state, flows, nodeId, dispatch }) {
  const def = NODE_DEFS[nodeId];
  const g = flows.g[nodeId];
  const dem = flows.dem[nodeId];
  const nimby = state.nimby[nodeId];
  const mix = state.assets.filter(a => a.nodeId === nodeId);
  const queued = state.queue.filter(q => q.nodeId === nodeId);
  const delay = state.policies.queueReform ? ECON.queueDelayReformed : ECON.queueDelayDefault;
  return (
    <div className="space-y-3">
      <Section title={`NODE ${nodeId} — ${def.name.toUpperCase()}`}>
        <div className="text-[11px] text-slate-400 italic mb-2">{def.blurb}</div>
        <Row k="Local demand" v={fmtGW(dem)} />
        <Row k="Local clean output (avg weather)" v={fmtGW(g.gen)} tone={g.gen < dem ? "warn" : null} />
        <Row k="Battery capacity here" v={fmtGW(g.battery)} />
        <div className="mt-2">
          <div className="flex justify-between text-[10px] text-slate-400 mb-1">
            <span>NIMBY OPPOSITION</span>
            <span className={nimby > 70 ? "text-red-400 font-bold" : nimby > 45 ? "text-amber-400" : "text-green-400"}>{Math.round(nimby)}%{nimby > 70 ? " ⚠ flashpoint" : ""}</span>
          </div>
          <Bar value={nimby} max={100} color={nimby > 70 ? "bg-red-500" : nimby > 45 ? "bg-amber-400" : "bg-green-500"} />
          <div className="text-[10px] text-slate-500 mt-1">Above 70% at year end: +4% Rebellion. Decays −6/yr.</div>
        </div>
      </Section>

      <Section title="CURRENT GENERATION MIX">
        {mix.length === 0 && <div className="text-[11px] text-slate-500 italic">Nothing but pylons and regret.</div>}
        {mix.map(a => (
          <div key={a.uid} className="flex justify-between text-[11px] py-0.5">
            <span className="text-slate-300">{a.icon} {a.name}</span>
            <span className="font-term text-green-400">{fmtGW(a.gw)}</span>
          </div>
        ))}
        {queued.map(q => (
          <div key={q.uid} className="flex justify-between text-[11px] py-0.5 opacity-60">
            <span className="text-slate-400">{ASSET_TYPES[q.type].icon} {q.label} (queued)</span>
            <span className="font-term text-amber-400">{q.turnsLeft} yr</span>
          </div>
        ))}
      </Section>

      <Section title={`COMMISSION NEW ASSETS (connect in ${delay} yr${delay > 1 ? "s" : ""})`}>
        <div className="text-[10px] text-slate-500 mb-1.5">Tip: you can also drag these from the palette straight onto the map.</div>
        {Object.values(ASSET_TYPES).map(t => {
          if (t.id === "offshore" && !def.offshoreOk) return null;
          if (t.id === "tidal" && !def.tidalOk) return null;
          const yieldMult = t.kind === "battery" ? 1 : def.yields[t.kind];
          const effGW = r1(t.gw * yieldMult);
          const cost = Math.round(t.cost * (t.id === "battery" ? state.batteryDiscount : 1) * (state.costMult || 1));
          const afford = state.treasury >= cost;
          return (
            <button key={t.id} disabled={!afford}
              onClick={() => dispatch({ type: "build", nodeId, assetId: t.id })}
              className="w-full text-left px-3 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition mb-1.5">
              <div className="flex justify-between items-baseline">
                <span className="text-[12.5px] font-bold text-slate-100">{t.icon} {t.name}</span>
                <span className={`font-term text-[12px] ${afford ? "text-green-400" : "text-red-400"}`}>{fmtM(cost)}</span>
              </div>
              <div className="text-[10.5px] text-slate-400">
                {t.kind === "battery" ? `${effGW} GW storage` : `${effGW} GW here`}
                {yieldMult !== 1 && t.kind !== "battery" ? ` (regional yield ×${yieldMult})` : ""} · NIMBY +{Math.round(t.nimby * def.nimbyFactor)} · {t.desc}
              </div>
            </button>
          );
        })}
      </Section>
    </div>
  );
}

function LinkTab({ state, flows, linkId, dispatch }) {
  const def = LINK_DEFS[linkId];
  const cap = state.links[linkId].cap;
  const flow = flows.byLink[linkId] || 0;
  const util = cap > 0 ? flow / cap : 1;
  const pending = state.linkQueue.filter(q => q.linkId === linkId);
  return (
    <div className="space-y-3">
      <Section title={`TRANSMISSION BOUNDARY — ${def.name.toUpperCase()}`}>
        <Row k="Capacity" v={fmtGW(cap)} />
        <Row k="Projected flow (avg weather)" v={fmtGW(flow)} tone={util >= 0.99 ? "bad" : util > 0.75 ? "warn" : null} />
        <div className="mt-2">
          <div className="flex justify-between text-[10px] text-slate-400 mb-1">
            <span>UTILISATION</span>
            <span className={util >= 0.99 ? "text-red-400 font-bold" : "text-slate-300"}>{Math.round(util * 100)}%{util >= 0.99 ? " ⚠ SATURATED" : ""}</span>
          </div>
          <Bar value={util * 100} max={100} color={util >= 0.99 ? "bg-red-500" : util > 0.75 ? "bg-amber-400" : "bg-green-500"} />
        </div>
        {util >= 0.99 && (
          <div className="mt-2 text-[11px] text-red-400 bg-red-950/40 border border-red-800 rounded p-2">
            ⚠ Boundary saturated. Surplus generation upstream will be <b>curtailed</b> (£40m/GW fine) and replaced by southern gas peakers, spiking the wholesale price.
          </div>
        )}
        {pending.map(q => (
          <div key={q.uid} className="mt-2 text-[11px] text-amber-400">⏳ {q.label} energising in {q.turnsLeft} yr</div>
        ))}
      </Section>

      <Section title="REINFORCEMENT OPTIONS">
        <div className="text-[10px] text-slate-500 mb-1.5">Tip: drag 🗼 or 🧵 from the palette directly onto a line.</div>
        {Object.values(LINK_UPGRADES).map(u => {
          if (u.id === "pylon" && def.fullySubsea) return null;
          const afford = state.treasury >= u.cost;
          return (
            <button key={u.id} disabled={!afford}
              onClick={() => dispatch({ type: "upgradeLink", linkId, upgradeId: u.id })}
              className="w-full text-left px-3 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition mb-1.5">
              <div className="flex justify-between items-baseline">
                <span className="text-[12.5px] font-bold text-slate-100">{u.icon} {u.id === "hvdc" && !def.subsea ? "Underground HVDC Cable" : u.name}</span>
                <span className={`font-term text-[12px] ${afford ? "text-green-400" : "text-red-400"}`}>{fmtM(u.cost)}</span>
              </div>
              <div className="text-[10.5px] text-slate-400">{u.desc}</div>
            </button>
          );
        })}
      </Section>
    </div>
  );
}

function RightPanel({ state, flows, selected, tab, setTab, dispatch }) {
  const title = selected
    ? (selected.type === "node" ? `NODE ${selected.id}` : LINK_DEFS[selected.id].name.toUpperCase())
    : (tab === "lab" ? "🧪 THE SKUNKWORKS" : "SYSTEM COMMAND");
  return (
    <div className="h-full flex flex-col bg-[#1e293b] rounded-xl border border-slate-700 overflow-hidden">
      <div className="px-3 py-2 border-b border-slate-700 flex items-center justify-between shrink-0">
        <div className="text-xs font-bold tracking-widest text-slate-300">{title}</div>
        {selected
          ? <button onClick={() => dispatch({ type: "select", sel: null })} className="text-[10px] text-sky-400 hover:text-sky-300">← back to national view</button>
          : (
            <div className="flex gap-1">
              <button onClick={() => setTab("national")}
                className={`px-2 py-0.5 rounded text-[10px] font-bold ${tab === "national" ? "bg-slate-600 text-slate-100" : "bg-slate-800 text-slate-400 hover:text-slate-200"}`}>🗺 COMMAND</button>
              <button onClick={() => setTab("lab")}
                className={`px-2 py-0.5 rounded text-[10px] font-bold ${tab === "lab" ? "bg-cyan-700 text-cyan-100" : "bg-slate-800 text-cyan-500 hover:text-cyan-300"}`}>🧪 SKUNKWORKS</button>
            </div>
          )}
      </div>
      <div className="scroll-y flex-1 min-h-0 p-3">
        {!selected && tab === "national" && <DefaultTab state={state} flows={flows} dispatch={dispatch} />}
        {!selected && tab === "lab" && <LabTab state={state} dispatch={dispatch} />}
        {selected && selected.type === "node" && <NodeTab state={state} flows={flows} nodeId={selected.id} dispatch={dispatch} />}
        {selected && selected.type === "link" && <LinkTab state={state} flows={flows} linkId={selected.id} dispatch={dispatch} />}
      </div>
    </div>
  );
}

/* ---------------------------- bottom console ---------------------------- */
function AdvisorBar({ state, flows }) {
  const tip = advise(state, flows);
  const color = tip.tone === "bad" ? "text-red-300 border-red-800 bg-red-950/30" : tip.tone === "warn" ? "text-amber-300 border-amber-800 bg-amber-950/20" : tip.tone === "good" ? "text-green-300 border-green-800 bg-green-950/20" : "text-slate-300 border-slate-700 bg-slate-800/60";
  return (
    <div className={`px-3 py-1.5 rounded-lg border text-[11.5px] mb-2 flex gap-2 items-center ${color}`}>
      <span className="text-base shrink-0">🎩</span>
      <span><b className="font-term text-[10px] tracking-widest opacity-70">SIR REGINALD (PERM. SEC.):</b> {tip.text}</span>
    </div>
  );
}

function Console({ state, dispatch }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [state.log.length]);
  const busy = state.phase !== "play";
  return (
    <div className="shrink-0 bg-[#0f172a] border border-slate-700 rounded-xl flex items-stretch gap-0 overflow-hidden h-full lg:h-[138px]">
      <div className="flex-1 min-w-0 flex flex-col">
        <div className="px-3 py-1 border-b border-slate-800 text-[10px] font-bold tracking-widest text-slate-500 flex justify-between">
          <span>📡 WESTMINSTER WIRE — LIVE</span>
          <span className="font-term">{state.log.length} dispatches</span>
        </div>
